<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#0a0a0c"/>
  <!-- Globe outline -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#4a9eff" stroke-width="1.2" opacity="0.9"/>
  <!-- Latitude lines (blue) -->
  <ellipse cx="16" cy="10" rx="9.5" ry="2.5" fill="none" stroke="#4a9eff" stroke-width="0.7" opacity="0.6"/>
  <ellipse cx="16" cy="16" rx="11" ry="3" fill="none" stroke="#4a9eff" stroke-width="0.7" opacity="0.5"/>
  <ellipse cx="16" cy="22" rx="9.5" ry="2.5" fill="none" stroke="#4a9eff" stroke-width="0.7" opacity="0.6"/>
  <!-- Longitude lines (gold) -->
  <ellipse cx="16" cy="16" rx="4" ry="11" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.8"/>
  <ellipse cx="16" cy="16" rx="8" ry="11" fill="none" stroke="#c9a84c" stroke-width="0.7" opacity="0.6"/>
  <ellipse cx="16" cy="16" rx="11" ry="11" fill="none" stroke="#c9a84c" stroke-width="0.5" opacity="0.3" transform="rotate(30 16 16)"/>
  <!-- Center glow -->
  <circle cx="16" cy="16" r="2" fill="#c9a84c" opacity="0.3"/>
  <circle cx="16" cy="16" r="1" fill="#4a9eff" opacity="0.6"/>
</svg>
