<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galahad Industries — The Seat Is Taken</title>
<meta name="description" content="Galahad Industries — Enterprise AI software. Stark Industries meets the Round Table.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=JetBrains+Mono:wght@300;400&family=Inter:wght@200;300;400&display=swap');
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050508;
    color: #fff;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    cursor: crosshair;
    width: 100vw; height: 100vh;
  }
  #bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
  #overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;
    pointer-events: none; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  #title-container {
    text-align: center; opacity: 0; transform: translateY(30px) scale(0.95);
    transition: opacity 2s cubic-bezier(0.16, 1, 0.3, 1), transform 2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #title-container.visible { opacity: 1; transform: translateY(0) scale(1); }
  .title-galahad {
    font-family: 'Cormorant Garamond', serif; font-weight: 600;
    font-size: clamp(3rem, 8vw, 7rem); letter-spacing: 0.3em;
    color: #c9a84c;
    text-shadow: 0 0 40px rgba(201,168,76,0.4), 0 0 80px rgba(201,168,76,0.15), 0 0 120px rgba(201,168,76,0.05);
    margin-bottom: 0.05em;
  }
  .title-industries {
    font-family: 'Cormorant Garamond', serif; font-weight: 300;
    font-size: clamp(1.5rem, 4vw, 3.5rem); letter-spacing: 0.6em;
    color: #4a9eff;
    text-shadow: 0 0 30px rgba(74,158,255,0.4), 0 0 60px rgba(74,158,255,0.15);
  }
  .title-industries .sword-i {
    color: #fff;
    text-shadow: 0 0 15px rgba(255,255,255,0.9), 0 0 30px rgba(201,168,76,0.6), 0 0 60px rgba(74,158,255,0.4), 0 0 90px rgba(201,168,76,0.2);
    display: inline-block;
    animation: pulse-i 3s ease-in-out infinite;
  }
  @keyframes pulse-i {
    0%, 100% { text-shadow: 0 0 15px rgba(255,255,255,0.9), 0 0 30px rgba(201,168,76,0.6), 0 0 60px rgba(74,158,255,0.4); }
    50% { text-shadow: 0 0 25px rgba(255,255,255,1), 0 0 50px rgba(201,168,76,0.9), 0 0 80px rgba(74,158,255,0.5), 0 0 120px rgba(201,168,76,0.3); }
  }
  .tagline {
    font-family: 'JetBrains Mono', monospace; font-weight: 300;
    font-size: clamp(0.7rem, 1.2vw, 1rem); letter-spacing: 0.15em;
    color: rgba(201,168,76,0.5); margin-top: 2em;
    opacity: 0; transition: opacity 2.5s ease;
  }
  .tagline.visible { opacity: 1; }
  .divider-line {
    width: clamp(200px, 30vw, 400px); height: 1px;
    background: linear-gradient(90deg, transparent, rgba(74,158,255,0.3), transparent);
    margin: 1.5em auto 0; position: relative; opacity: 0; transition: opacity 2s ease;
  }
  .divider-line.visible { opacity: 1; }
  .divider-dot {
    position: absolute; top: -2px; width: 4px; height: 4px;
    border-radius: 50%; background: #4a9eff; box-shadow: 0 0 8px #4a9eff, 0 0 16px rgba(74,158,255,0.3);
    animation: dot-travel 4s linear infinite;
  }
  .divider-dot:nth-child(2) { animation-delay: -2s; opacity: 0.5; }
  @keyframes dot-travel { 0% { left: 0; } 100% { left: calc(100% - 4px); } }
  #flash-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.3) 0%, rgba(201,168,76,0.2) 30%, rgba(74,158,255,0.1) 60%, transparent 80%);
    opacity: 0; z-index: 3; pointer-events: none;
  }
  .hud-readout {
    position: fixed; font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 0.08em; z-index: 2; pointer-events: none;
    opacity: 0; line-height: 1.6;
  }
  .hud-readout.active { animation: hud-cycle 8s ease-in-out infinite; }
  @keyframes hud-cycle { 0%,100% { opacity: 0; } 10%,90% { opacity: 1; } }
  .hud-tl { top: 30px; left: 30px; color: rgba(74,158,255,0.25); }
  .hud-tr { top: 30px; right: 30px; text-align: right; color: rgba(201,168,76,0.2); }
  .hud-bl { bottom: 30px; left: 30px; color: rgba(201,168,76,0.2); }
  .hud-br { bottom: 30px; right: 30px; text-align: right; color: rgba(74,158,255,0.25); }
</style>
</head>
<body>
<div id="bg"></div>
<div id="flash-overlay"></div>
<div id="overlay">
  <div id="title-container">
    <div class="title-galahad">GALAHAD</div>
    <div class="title-industries">INDUSTR<span class="sword-i">I</span>ES</div>
    <div class="tagline">The seat is taken.</div>
    <div class="divider-line"><div class="divider-dot"></div><div class="divider-dot"></div></div>
  </div>
</div>
<div class="hud-readout hud-tl" id="hud-tl">SYS.CORE // ONLINE<br>THREAT.LEVEL: NOMINAL<br>SHIELD.INTEGRITY: 100%</div>
<div class="hud-readout hud-tr" id="hud-tr">LAT 27.9506 // LON 153.3994<br>NODE.CLUSTER: ACTIVE<br>UPLINK: ESTABLISHED</div>
<div class="hud-readout hud-bl" id="hud-bl">GRAIL.PROTOCOL: ARMED<br>ROUND.TABLE: 12/12<br>EXCALIBUR: STANDBY</div>
<div class="hud-readout hud-br" id="hud-br">PWR.OUTPUT: 3.21 TW<br>QUANTUM.STATE: STABLE<br>AI.CORES: 7 ONLINE</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ============================================================
// CONSTANTS
// ============================================================
const GOLD = new THREE.Color(0xc9a84c);
const BLUE = new THREE.Color(0x4a9eff);
const BG = new THREE.Color(0x050508);

// ============================================================
// RENDERER + SCENE + CAMERA
// ============================================================
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.getElementById('bg').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = BG;
scene.fog = new THREE.FogExp2(0x050508, 0.008);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 300);
camera.position.set(0, 6, 30);
camera.lookAt(0, 2, 0);

// Post-processing
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  1.4, 0.6, 0.15
);
composer.addPass(bloom);

// Mouse tracking
const mouse = { x: 0, y: 0, wx: 0, wy: 0, wz: 0 };
window.addEventListener('mousemove', e => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
});
window.addEventListener('touchmove', e => {
  mouse.x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
}, { passive: true });

// Resize
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloom.resolution.set(w, h);
});

// ============================================================
// GROUND GRID — Tron-style perspective floor
// ============================================================
const gridMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: {
    uTime: { value: 0 },
    uImpact: { value: 0 },
    uMouse: { value: new THREE.Vector3() },
  },
  vertexShader: `
    varying vec3 vWorldPos;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform float uTime, uImpact;
    uniform vec3 uMouse;
    varying vec3 vWorldPos;

    float grid(vec2 p, float spacing, float thickness) {
      vec2 g = abs(fract(p / spacing) - 0.5) * spacing;
      float d = min(g.x, g.y);
      return 1.0 - smoothstep(0.0, thickness, d);
    }

    void main() {
      vec2 p = vWorldPos.xz;
      float dist = length(p);

      // Multi-scale grid
      float g1 = grid(p, 2.0, 0.04) * 0.5;
      float g2 = grid(p, 10.0, 0.06) * 0.8;
      float g3 = grid(p, 0.5, 0.02) * 0.15;
      float g = max(max(g1, g2), g3);

      // Radial pulse waves
      float wave1 = sin(dist * 0.6 - uTime * 1.5) * 0.5 + 0.5;
      float wave2 = sin(dist * 0.3 - uTime * 0.8 + 1.5) * 0.5 + 0.5;
      g *= 0.4 + wave1 * 0.4 + wave2 * 0.2;

      // Impact shockwave
      float impactWave = sin(dist * 2.0 - uImpact * 30.0) * exp(-dist * 0.05) * exp(-uImpact * 2.0);
      g += max(0.0, impactWave) * 2.0;

      // Distance fade
      float fade = exp(-dist * 0.015) * smoothstep(100.0, 20.0, dist);

      // Mouse spotlight
      float md = length(p - uMouse.xz);
      float spotlight = exp(-md * 0.12) * 0.6;

      // Color: gold near center, blue outward
      vec3 col = mix(vec3(0.79, 0.66, 0.30), vec3(0.29, 0.62, 1.0), smoothstep(8.0, 30.0, dist));
      col += spotlight * vec3(0.3, 0.4, 0.6);

      float alpha = g * fade * (0.25 + spotlight * 0.4);
      gl_FragColor = vec4(col, alpha);
    }
  `
});
const gridMesh = new THREE.Mesh(new THREE.PlaneGeometry(250, 250, 1, 1), gridMat);
gridMesh.rotation.x = -Math.PI / 2;
gridMesh.position.y = -3;
scene.add(gridMesh);

// ============================================================
// HEX DOME — subtle background structure
// ============================================================
const hexDomeMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, transparent: true, depthWrite: false,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    varying vec3 vPos;
    void main() {
      vPos = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    varying vec3 vPos;

    float hexGrid(vec2 p) {
      vec2 q = vec2(p.x * 2.0 / sqrt(3.0), p.y + p.x / sqrt(3.0));
      vec2 pi = floor(q), pf = fract(q);
      float v = mod(pi.x + pi.y, 3.0);
      float ca = step(1.0, v), cb = step(2.0, v);
      vec2 ma = step(pf.xy, pf.yx);
      float e = dot(ma, 1.0 - pf.yx + ca * (pf.x + pf.y - 1.0) + cb * (pf.yx - 2.0 * pf.xy));
      return smoothstep(0.0, 0.08, e);
    }

    void main() {
      vec2 p = vPos.xz * 0.08;
      float hex = 1.0 - hexGrid(p);
      float pulse = 0.5 + 0.5 * sin(length(vPos.xz) * 0.02 - uTime * 0.3);
      vec3 col = mix(vec3(0.01, 0.02, 0.05), vec3(0.03, 0.05, 0.10), pulse);
      gl_FragColor = vec4(col, hex * 0.06);
    }
  `
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(120, 48, 48), hexDomeMat));

// ============================================================
// RING SYSTEM — JARVIS-style concentric holographic rings
// ============================================================
const ringGroup = new THREE.Group();
ringGroup.position.y = 3;
scene.add(ringGroup);

const RING_COUNT = 9;
const rings = [];

function makeRingShader(color, dashCount) {
  return new THREE.ShaderMaterial({
    transparent: true, side: THREE.DoubleSide, depthWrite: false,
    uniforms: {
      uTime: { value: 0 },
      uColor: { value: color.clone() },
      uAlpha: { value: 0.5 },
      uDashes: { value: dashCount },
      uGlitch: { value: 0 },
    },
    vertexShader: `
      varying vec2 vUv;
      varying vec3 vNorm;
      varying vec3 vViewDir;
      void main() {
        vUv = uv;
        vNorm = normalize(normalMatrix * normal);
        vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
        vViewDir = normalize(-mvPos.xyz);
        gl_Position = projectionMatrix * mvPos;
      }
    `,
    fragmentShader: `
      uniform float uTime, uAlpha, uDashes, uGlitch;
      uniform vec3 uColor;
      varying vec2 vUv;
      varying vec3 vNorm, vViewDir;

      float rand(float n) { return fract(sin(n) * 43758.5453); }

      void main() {
        // Dashed segments with glyphs
        float angle = vUv.x * 6.283185;
        float dash = sin(angle * uDashes + uTime * 1.5) * 0.5 + 0.5;
        float seg = smoothstep(0.3, 0.7, dash);

        // Fine tick marks
        float ticks = sin(angle * uDashes * 4.0) * 0.5 + 0.5;
        float tickLine = step(0.92, ticks) * 0.3;

        // Fresnel edge glow
        float fresnel = pow(1.0 - abs(dot(vNorm, vViewDir)), 3.0);

        // Glitch
        float glitchOffset = uGlitch * step(0.8, rand(floor(vUv.x * 50.0 + uTime * 20.0)));

        float a = (0.2 + seg * 0.3 + tickLine + fresnel * 0.5 + glitchOffset) * uAlpha;
        vec3 col = uColor * (1.0 + fresnel * 0.4);
        gl_FragColor = vec4(col, a);
      }
    `
  });
}

for (let i = 0; i < RING_COUNT; i++) {
  const radius = 2.5 + i * 1.5;
  const tube = 0.015 + (i % 3 === 0 ? 0.02 : 0.008);
  const speed = (0.08 + i * 0.03) * (i % 2 === 0 ? 1 : -1);
  const tiltX = Math.PI / 2 + (Math.random() - 0.5) * 0.35;
  const tiltZ = (Math.random() - 0.5) * 0.2;
  const color = i % 3 === 0 ? GOLD : (i % 3 === 1 ? BLUE : GOLD.clone().lerp(BLUE, 0.5));
  const dashes = 3 + Math.floor(Math.random() * 8);

  const geo = new THREE.TorusGeometry(radius, tube, 6, 200);
  const mat = makeRingShader(color, dashes);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.x = tiltX;
  mesh.rotation.z = tiltZ;

  rings.push({ mesh, speed, radius, tiltX, tiltZ, baseAlpha: 0.5 });
  ringGroup.add(mesh);
}

// ============================================================
// GLYPH PARTICLES — tiny dots scattered through the rings
// ============================================================
const GLYPH_N = 800;
const glyphGeo = new THREE.BufferGeometry();
const gPos = new Float32Array(GLYPH_N * 3);
const gCol = new Float32Array(GLYPH_N * 3);
const gSize = new Float32Array(GLYPH_N);
const glyphs = [];

for (let i = 0; i < GLYPH_N; i++) {
  const ringI = Math.floor(Math.random() * RING_COUNT);
  const r = 2.5 + ringI * 1.5 + (Math.random() - 0.5) * 0.8;
  const angle = Math.random() * Math.PI * 2;
  const y = (Math.random() - 0.5) * 2;
  gPos[i*3] = Math.cos(angle) * r;
  gPos[i*3+1] = y;
  gPos[i*3+2] = Math.sin(angle) * r;
  const c = ringI % 2 === 0 ? GOLD : BLUE;
  gCol[i*3] = c.r; gCol[i*3+1] = c.g; gCol[i*3+2] = c.b;
  gSize[i] = 1 + Math.random() * 3;
  glyphs.push({ ringI, r, angle, yBase: y, speed: rings[ringI].speed * (0.7 + Math.random() * 0.6) });
}
glyphGeo.setAttribute('position', new THREE.BufferAttribute(gPos, 3));
glyphGeo.setAttribute('color', new THREE.BufferAttribute(gCol, 3));
glyphGeo.setAttribute('size', new THREE.BufferAttribute(gSize, 1));

const glyphMat = new THREE.ShaderMaterial({
  transparent: true, vertexColors: true, depthWrite: false,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    attribute float size;
    varying vec3 vColor; varying float vAlpha;
    uniform float uTime;
    void main() {
      vColor = color;
      vAlpha = 0.25 + 0.35 * sin(uTime * 1.5 + position.x * 2.0 + position.z * 1.7);
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * (180.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vColor; varying float vAlpha;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      gl_FragColor = vec4(vColor, smoothstep(0.5, 0.05, d) * vAlpha);
    }
  `
});
const glyphPoints = new THREE.Points(glyphGeo, glyphMat);
ringGroup.add(glyphPoints);

// ============================================================
// ORBITAL DATA FRAGMENTS — floating rectangles on orbital paths
// ============================================================
const ORBITAL_N = 50;
const orbitals = [];
const orbitalGroup = new THREE.Group();
ringGroup.add(orbitalGroup);

for (let i = 0; i < ORBITAL_N; i++) {
  const w = 0.08 + Math.random() * 0.25;
  const h = 0.03 + Math.random() * 0.1;
  const isGold = Math.random() > 0.45;
  const mat = new THREE.MeshBasicMaterial({
    color: isGold ? 0xc9a84c : 0x4a9eff,
    transparent: true, opacity: 0.3 + Math.random() * 0.35, side: THREE.DoubleSide, depthWrite: false,
  });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  const orbit = 4 + Math.random() * 14;
  const angle = Math.random() * Math.PI * 2;
  const yOff = (Math.random() - 0.5) * 7;
  const speed = (0.03 + Math.random() * 0.12) * (Math.random() > 0.5 ? 1 : -1);
  const inclination = (Math.random() - 0.5) * 0.6;
  orbitals.push({ mesh, orbit, angle, yOff, speed, inclination });
  orbitalGroup.add(mesh);
}

// ============================================================
// ARC FLASHES — electrical discharges between ring layers
// ============================================================
const arcFlashes = [];
const arcFlashGroup = new THREE.Group();
ringGroup.add(arcFlashGroup);

function spawnArc() {
  const ri = Math.floor(Math.random() * (RING_COUNT - 1));
  const r1 = 2.5 + ri * 1.5, r2 = 2.5 + (ri + 1) * 1.5;
  const baseAngle = Math.random() * Math.PI * 2;
  const pts = [];
  const N = 12;
  for (let j = 0; j <= N; j++) {
    const t = j / N;
    const r = r1 + (r2 - r1) * t;
    const a = baseAngle + (Math.random() - 0.5) * 0.5 * t;
    const y = (Math.random() - 0.5) * 0.8;
    pts.push(new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const color = Math.random() > 0.5 ? 0xc9a84c : 0x4a9eff;
  const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 1 });
  const line = new THREE.Line(geo, mat);
  arcFlashGroup.add(line);
  arcFlashes.push({ line, life: 0, maxLife: 0.15 + Math.random() * 0.25 });
}

// ============================================================
// VOLUMETRIC LIGHT BEAMS from center
// ============================================================
const beamGroup = new THREE.Group();
beamGroup.position.y = -3;
scene.add(beamGroup);
const beams = [];

function spawnBeam() {
  const geo = new THREE.CylinderGeometry(0.01, 0.25, 35, 6, 1, true);
  const color = Math.random() > 0.5 ? 0xc9a84c : 0x4a9eff;
  const mat = new THREE.MeshBasicMaterial({
    color, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set((Math.random() - 0.5) * 3, 17, (Math.random() - 0.5) * 3);
  beamGroup.add(mesh);
  beams.push({ mesh, life: 0, maxLife: 2 + Math.random() * 3 });
}

// ============================================================
// SWORD — holographic light sword
// ============================================================
const swordGroup = new THREE.Group();
swordGroup.position.y = 3;
swordGroup.visible = false;
scene.add(swordGroup);

// Build sword meshes
function buildSword() {
  const g = new THREE.Group();

  // Blade — elongated shape
  const bladeShape = new THREE.Shape();
  bladeShape.moveTo(0, -3.2);
  bladeShape.bezierCurveTo(0.18, -2.5, 0.14, 0, 0.08, 2.8);
  bladeShape.lineTo(0, 3.5);
  bladeShape.lineTo(-0.08, 2.8);
  bladeShape.bezierCurveTo(-0.14, 0, -0.18, -2.5, 0, -3.2);

  const bladeGeo = new THREE.ExtrudeGeometry(bladeShape, {
    depth: 0.05, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.015, bevelSegments: 2,
  });
  bladeGeo.center();

  // Solid bright core
  const bladeMesh = new THREE.Mesh(bladeGeo, new THREE.MeshBasicMaterial({
    color: 0xffffff, transparent: true, opacity: 0,
  }));

  // Blue wireframe overlay
  const edgeGeo = new THREE.EdgesGeometry(bladeGeo);
  const wireframe = new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({
    color: 0x4a9eff, transparent: true, opacity: 0,
  }));

  // Crossguard
  const crossGeo = new THREE.BoxGeometry(1.4, 0.1, 0.1);
  const crossMesh = new THREE.Mesh(crossGeo, new THREE.MeshBasicMaterial({
    color: 0xc9a84c, transparent: true, opacity: 0,
  }));
  crossMesh.position.y = -3.2;
  const crossWire = new THREE.LineSegments(
    new THREE.EdgesGeometry(crossGeo),
    new THREE.LineBasicMaterial({ color: 0x4a9eff, transparent: true, opacity: 0 })
  );
  crossMesh.add(crossWire);

  // Grip
  const gripGeo = new THREE.CylinderGeometry(0.055, 0.065, 1.1, 8);
  const gripMesh = new THREE.Mesh(gripGeo, new THREE.MeshBasicMaterial({
    color: 0xc9a84c, transparent: true, opacity: 0,
  }));
  gripMesh.position.y = -3.9;

  // Pommel
  const pommelGeo = new THREE.OctahedronGeometry(0.12, 1);
  const pommelMesh = new THREE.Mesh(pommelGeo, new THREE.MeshBasicMaterial({
    color: 0xc9a84c, transparent: true, opacity: 0,
  }));
  pommelMesh.position.y = -4.6;

  g.add(bladeMesh, wireframe, crossMesh, gripMesh, pommelMesh);

  // Glow plane
  const glowGeo = new THREE.PlaneGeometry(1.8, 9);
  const glowMat = new THREE.ShaderMaterial({
    transparent: true, side: THREE.DoubleSide, depthWrite: false,
    uniforms: { uTime: { value: 0 }, uAlpha: { value: 0 } },
    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      uniform float uTime, uAlpha;
      varying vec2 vUv;
      void main() {
        float cx = abs(vUv.x - 0.5) * 2.0;
        float core = exp(-cx * 6.0) * 0.5;
        float outer = exp(-cx * 2.0) * 0.15;
        float shimmer = 0.8 + 0.2 * sin(uTime * 4.0 + vUv.y * 15.0);
        float a = (core + outer) * shimmer * uAlpha;
        vec3 col = mix(vec3(0.29,0.62,1.0), vec3(1.0,1.0,1.0), core);
        gl_FragColor = vec4(col, a);
      }
    `
  });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  glow.userData.isGlow = true;
  g.add(glow);

  return g;
}

const sword = buildSword();
swordGroup.add(sword);

// Scan line
const scanMat = new THREE.MeshBasicMaterial({
  color: 0x4a9eff, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false,
});
const scanLine = new THREE.Mesh(new THREE.PlaneGeometry(2.5, 0.04), scanMat);
swordGroup.add(scanLine);

// ============================================================
// SWORD ASSEMBLY PARTICLES
// ============================================================
const SP_N = 2500;
const spGeo = new THREE.BufferGeometry();
const spPos = new Float32Array(SP_N * 3);
const spCol = new Float32Array(SP_N * 3);
const spSize = new Float32Array(SP_N);
const spTargets = [];
const spStarts = [];

for (let i = 0; i < SP_N; i++) {
  // Start positions: scattered in a sphere
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const rad = 15 + Math.random() * 20;
  const sx = rad * Math.sin(phi) * Math.cos(theta);
  const sy = rad * Math.sin(phi) * Math.sin(theta);
  const sz = rad * Math.cos(phi);
  spPos[i*3] = sx; spPos[i*3+1] = sy + 3; spPos[i*3+2] = sz;
  spStarts.push(new THREE.Vector3(sx, sy + 3, sz));

  // Target positions: on the sword
  const t = Math.random();
  let tx, ty, tz;
  if (t < 0.65) {
    ty = -3.2 + Math.random() * 6.7;
    const w = 0.18 * Math.max(0, 1 - Math.pow(Math.abs(ty) / 3.5, 1.5));
    tx = (Math.random() - 0.5) * w * 2;
    tz = (Math.random() - 0.5) * 0.05;
  } else if (t < 0.8) {
    ty = -3.2 + (Math.random() - 0.5) * 0.1;
    tx = (Math.random() - 0.5) * 1.4;
    tz = (Math.random() - 0.5) * 0.1;
  } else {
    ty = -4.6 + Math.random() * 1.4;
    tx = (Math.random() - 0.5) * 0.13;
    tz = (Math.random() - 0.5) * 0.13;
  }
  spTargets.push(new THREE.Vector3(tx, ty + 3, tz));

  const isG = Math.random() > 0.35;
  const c = isG ? GOLD : BLUE;
  spCol[i*3] = c.r; spCol[i*3+1] = c.g; spCol[i*3+2] = c.b;
  spSize[i] = 0.8 + Math.random() * 2.5;
}
spGeo.setAttribute('position', new THREE.BufferAttribute(spPos, 3));
spGeo.setAttribute('color', new THREE.BufferAttribute(spCol, 3));
spGeo.setAttribute('size', new THREE.BufferAttribute(spSize, 1));

const spMat = new THREE.ShaderMaterial({
  transparent: true, vertexColors: true, depthWrite: false,
  uniforms: { uAlpha: { value: 1 } },
  vertexShader: `
    attribute float size;
    varying vec3 vColor;
    uniform float uAlpha;
    varying float vA;
    void main() {
      vColor = color; vA = uAlpha;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * (160.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vColor; varying float vA;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      gl_FragColor = vec4(vColor * 1.5, smoothstep(0.5, 0.0, d) * vA);
    }
  `
});
const spPoints = new THREE.Points(spGeo, spMat);
spPoints.visible = false;
scene.add(spPoints);

// ============================================================
// TRAIL PARTICLES — for sword flight
// ============================================================
const TRAIL_N = 600;
const tGeo = new THREE.BufferGeometry();
const tPos = new Float32Array(TRAIL_N * 3);
const tCol = new Float32Array(TRAIL_N * 3);
const tSize = new Float32Array(TRAIL_N);
const tData = [];
for (let i = 0; i < TRAIL_N; i++) {
  tPos[i*3+1] = -200;
  const c = Math.random() > 0.5 ? GOLD : BLUE;
  tCol[i*3] = c.r; tCol[i*3+1] = c.g; tCol[i*3+2] = c.b;
  tSize[i] = 1 + Math.random() * 3;
  tData.push({ life: 0, maxLife: 0, vx: 0, vy: 0, vz: 0, active: false });
}
tGeo.setAttribute('position', new THREE.BufferAttribute(tPos, 3));
tGeo.setAttribute('color', new THREE.BufferAttribute(tCol, 3));
tGeo.setAttribute('size', new THREE.BufferAttribute(tSize, 1));
const tMat = new THREE.ShaderMaterial({
  transparent: true, vertexColors: true, depthWrite: false,
  vertexShader: `
    attribute float size;
    varying vec3 vColor;
    void main() {
      vColor = color;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * (200.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      gl_FragColor = vec4(vColor * 2.0, smoothstep(0.5, 0.0, d) * 0.7);
    }
  `
});
scene.add(new THREE.Points(tGeo, tMat));

function emitTrail(x, y, z, n, spread, velScale) {
  let emitted = 0;
  for (let i = 0; i < TRAIL_N && emitted < n; i++) {
    if (!tData[i].active) {
      tPos[i*3] = x + (Math.random()-0.5) * spread;
      tPos[i*3+1] = y + (Math.random()-0.5) * spread;
      tPos[i*3+2] = z + (Math.random()-0.5) * spread;
      tData[i].vx = (Math.random()-0.5) * velScale;
      tData[i].vy = (Math.random()-0.5) * velScale;
      tData[i].vz = (Math.random()-0.5) * velScale;
      tData[i].life = 0;
      tData[i].maxLife = 0.4 + Math.random() * 1.2;
      tData[i].active = true;
      emitted++;
    }
  }
}

// ============================================================
// STATE MACHINE
// ============================================================
// 0: intro (rings breathe) — 2.5s
// 1: particle assembly — 3.5s
// 2: sword materialization + scan — 2.5s
// 3: sword launch up — 0.7s
// 4: pause (rings shatter/reform) — 0.7s
// 5: sword descends — 0.4s
// 6: impact — 2s
// 7: ambient (forever)

let state = 0, stateT = 0;
let swordWorldY = 3;
let lastArc = 0, lastBeam = 0;
let impactT = -1;
const clock = new THREE.Clock();

function flash(duration) {
  const el = document.getElementById('flash-overlay');
  el.style.transition = 'none';
  el.style.opacity = '1';
  requestAnimationFrame(() => {
    el.style.transition = `opacity ${duration}s ease-out`;
    el.style.opacity = '0';
  });
}

function showTitle() {
  document.getElementById('title-container').classList.add('visible');
  setTimeout(() => {
    document.querySelector('.tagline').classList.add('visible');
    document.querySelector('.divider-line').classList.add('visible');
  }, 600);
  // Activate HUD readouts
  setTimeout(() => {
    document.querySelectorAll('.hud-readout').forEach((el, i) => {
      setTimeout(() => el.classList.add('active'), i * 400);
    });
  }, 1500);
}

// Helper: set sword opacity across all children
function setSwordOpacity(alpha) {
  sword.children.forEach(child => {
    if (child.userData.isGlow) {
      child.material.uniforms.uAlpha.value = alpha;
    } else if (child.material) {
      child.material.opacity = alpha;
      // Also update wireframe children
      child.children?.forEach(c => { if (c.material) c.material.opacity = alpha * 0.6; });
    }
  });
}

// ============================================================
// MAIN ANIMATION LOOP
// ============================================================
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime();
  stateT += dt;

  // Mouse world approximation
  mouse.wx = mouse.x * 30;
  mouse.wz = -mouse.y * 20 + 10;
  gridMat.uniforms.uMouse.value.set(mouse.wx, 0, mouse.wz);

  // ---- STATE TRANSITIONS ----
  if (state === 0 && stateT > 2.5) {
    state = 1; stateT = 0;
    spPoints.visible = true;
  }
  else if (state === 1 && stateT > 3.5) {
    state = 2; stateT = 0;
    swordGroup.visible = true;
    setSwordOpacity(0);
  }
  else if (state === 2 && stateT > 2.5) {
    state = 3; stateT = 0;
    spPoints.visible = false;
    scanMat.opacity = 0;
  }
  else if (state === 3 && stateT > 0.7) {
    state = 4; stateT = 0;
    rings.forEach(r => { r.mesh.material.uniforms.uGlitch.value = 0; r.mesh.material.uniforms.uAlpha.value = r.baseAlpha; });
  }
  else if (state === 4 && stateT > 0.7) {
    state = 5; stateT = 0;
  }
  else if (state === 5 && stateT > 0.4) {
    state = 6; stateT = 0;
    swordGroup.visible = false;
    flash(0.6);
    impactT = 0;
    gridMat.uniforms.uImpact.value = 0.001;
    showTitle();
    // Ring pulse
    rings.forEach(r => { r.mesh.material.uniforms.uAlpha.value = 1.0; });
    emitTrail(0, 3, 0, 120, 4, 8);
  }
  else if (state === 6 && stateT > 2.5) {
    state = 7; stateT = 0;
  }

  // ---- STATE BEHAVIORS ----
  // State 1: particle assembly
  if (state === 1) {
    const p = Math.min(stateT / 3.5, 1);
    const ease = 1 - Math.pow(1 - p, 4);
    const arr = spGeo.attributes.position.array;
    for (let i = 0; i < SP_N; i++) {
      const tgt = spTargets[i];
      const start = spStarts[i];
      arr[i*3]   = start.x + (tgt.x - start.x) * ease;
      arr[i*3+1] = start.y + (tgt.y - start.y) * ease;
      arr[i*3+2] = start.z + (tgt.z - start.z) * ease;
      // Add slight orbital motion during convergence
      const orbitPhase = t * 2 + i * 0.01;
      const orbitR = (1 - ease) * 0.5;
      arr[i*3]   += Math.cos(orbitPhase) * orbitR;
      arr[i*3+2] += Math.sin(orbitPhase) * orbitR;
    }
    spGeo.attributes.position.needsUpdate = true;
  }

  // State 2: sword materializes, particles fade, scan lines
  if (state === 2) {
    const p = Math.min(stateT / 2.0, 1);
    spMat.uniforms.uAlpha.value = Math.max(0, 1 - p * 1.5);
    setSwordOpacity(p * 0.9);
    // Scan line oscillates
    const scanY = -4.6 + ((stateT * 1.5) % 1) * 8.1;
    scanLine.position.y = scanY;
    scanMat.opacity = 0.5 + 0.2 * Math.sin(t * 12);
    // Glow shader time
    sword.children.forEach(c => {
      if (c.userData.isGlow) c.material.uniforms.uTime.value = t;
    });
  }

  // State 3: launch upward
  if (state === 3) {
    const p = Math.min(stateT / 0.7, 1);
    const eased = 1 - Math.pow(1 - p, 5);
    swordWorldY = 3 + eased * 40;
    swordGroup.position.y = swordWorldY;
    // Trail
    emitTrail(0, swordWorldY - 2, 0, 8, 0.3, 2);
    // Glitch rings as sword passes through
    rings.forEach(r => {
      r.mesh.material.uniforms.uGlitch.value = 0.6 * Math.exp(-Math.abs(swordWorldY - 3) * 0.05);
      if (Math.abs(swordWorldY - 3) < 5) {
        r.mesh.material.uniforms.uAlpha.value = 0.15 + Math.random() * 0.25;
      }
    });
    // Update glow
    sword.children.forEach(c => { if (c.userData.isGlow) c.material.uniforms.uTime.value = t; });
  }

  // State 4: pause, scatter particles
  if (state === 4) {
    emitTrail((Math.random()-0.5)*8, 3 + Math.random()*4, (Math.random()-0.5)*8, 3, 1, 3);
    // Rings recalibrate
    rings.forEach(r => {
      r.mesh.material.uniforms.uAlpha.value += (r.baseAlpha - r.mesh.material.uniforms.uAlpha.value) * 0.05;
      r.mesh.material.uniforms.uGlitch.value *= 0.9;
    });
  }

  // State 5: descend fast
  if (state === 5) {
    const p = Math.min(stateT / 0.4, 1);
    const eased = p * p * p; // easeInCubic — accelerating
    swordWorldY = 43 - eased * 40;
    swordGroup.position.y = swordWorldY;
    swordGroup.visible = true;
    // Energy column trail
    emitTrail(0, swordWorldY + 3, 0, 15, 0.2, 1.5);
    sword.children.forEach(c => { if (c.userData.isGlow) c.material.uniforms.uTime.value = t; });
  }

  // State 6: impact settling
  if (state === 6) {
    // Ring alpha settle
    rings.forEach(r => {
      r.mesh.material.uniforms.uAlpha.value += (r.baseAlpha - r.mesh.material.uniforms.uAlpha.value) * 0.03;
    });
  }

  // ---- ALWAYS-ON UPDATES ----

  // Rings rotation
  rings.forEach(r => {
    r.mesh.rotation.z += r.speed * dt;
    r.mesh.material.uniforms.uTime.value = t;

    // Mouse proximity highlight
    if (state >= 6) {
      const mDist = Math.abs(Math.sqrt(mouse.wx * mouse.wx + mouse.wz * mouse.wz) * 0.5 - r.radius);
      if (mDist < 3) {
        r.mesh.material.uniforms.uAlpha.value = Math.min(0.85, r.baseAlpha + (1 - mDist/3) * 0.35);
      }
    }
  });

  // Glyph particles orbit
  glyphMat.uniforms.uTime.value = t;
  const gArr = glyphGeo.attributes.position.array;
  for (let i = 0; i < GLYPH_N; i++) {
    const g = glyphs[i];
    g.angle += g.speed * dt;
    gArr[i*3]   = Math.cos(g.angle) * g.r;
    gArr[i*3+1] = g.yBase + Math.sin(t * 0.4 + i * 0.1) * 0.3;
    gArr[i*3+2] = Math.sin(g.angle) * g.r;
  }
  glyphGeo.attributes.position.needsUpdate = true;

  // Orbitals
  orbitals.forEach(o => {
    o.angle += o.speed * dt;
    const yBob = Math.sin(t * 0.25 + o.angle * 2) * 0.6;
    o.mesh.position.set(
      Math.cos(o.angle) * o.orbit,
      o.yOff + yBob + Math.sin(o.inclination) * Math.sin(o.angle) * 2,
      Math.sin(o.angle) * o.orbit
    );
    o.mesh.lookAt(camera.position);
    // Mouse attraction
    const dx = mouse.wx * 0.5 - o.mesh.position.x;
    const dz = (mouse.wz - 10) * 0.5 - o.mesh.position.z;
    const dist = Math.sqrt(dx*dx + dz*dz);
    if (dist < 10) {
      const f = (1 - dist/10) * 0.4 * dt;
      o.mesh.position.x += dx * f;
      o.mesh.position.z += dz * f;
    }
  });

  // Arc flashes
  if (t - lastArc > 0.3 + Math.random() * 1.5) { spawnArc(); lastArc = t; }
  for (let i = arcFlashes.length - 1; i >= 0; i--) {
    const af = arcFlashes[i];
    af.life += dt;
    af.line.material.opacity = Math.max(0, 1 - af.life / af.maxLife);
    if (af.life >= af.maxLife) {
      arcFlashGroup.remove(af.line);
      af.line.geometry.dispose(); af.line.material.dispose();
      arcFlashes.splice(i, 1);
    }
  }

  // Beams (ambient only)
  if (state >= 7 && t - lastBeam > 2.5 + Math.random() * 4) { spawnBeam(); lastBeam = t; }
  for (let i = beams.length - 1; i >= 0; i--) {
    const b = beams[i];
    b.life += dt;
    const p = b.life / b.maxLife;
    b.mesh.material.opacity = p < 0.15 ? (p/0.15) * 0.12 : Math.max(0, (1-(p-0.15)/0.85) * 0.12);
    if (b.life >= b.maxLife) {
      beamGroup.remove(b.mesh);
      b.mesh.geometry.dispose(); b.mesh.material.dispose();
      beams.splice(i, 1);
    }
  }

  // Trail particles
  for (let i = 0; i < TRAIL_N; i++) {
    if (!tData[i].active) continue;
    tData[i].life += dt;
    if (tData[i].life >= tData[i].maxLife) {
      tData[i].active = false; tPos[i*3+1] = -200;
    } else {
      tPos[i*3]   += tData[i].vx * dt;
      tPos[i*3+1] += tData[i].vy * dt;
      tPos[i*3+2] += tData[i].vz * dt;
      tData[i].vy -= 3 * dt;
      // Fade: reduce velocity
      tData[i].vx *= 0.98; tData[i].vz *= 0.98;
    }
  }
  tGeo.attributes.position.needsUpdate = true;

  // Impact grid pulse
  if (impactT >= 0) {
    impactT += dt;
    gridMat.uniforms.uImpact.value = impactT;
    if (impactT > 3) impactT = -1;
  }

  // Grid + hex dome
  gridMat.uniforms.uTime.value = t;
  hexDomeMat.uniforms.uTime.value = t;

  // Camera
  if (state <= 2) {
    camera.position.x = mouse.x * 1.5;
    camera.position.y = 6 + mouse.y * 0.8;
    camera.position.z = 30;
    camera.lookAt(0, 3, 0);
  } else if (state >= 3 && state <= 5) {
    // Track sword during flight
    camera.position.x = mouse.x * 2;
    camera.position.y = 6 + mouse.y * 1;
    camera.position.z = 30;
    camera.lookAt(0, Math.min(swordWorldY, 15), 0);
  } else {
    // Ambient gentle drift
    camera.position.x = Math.sin(t * 0.08) * 2 + mouse.x * 2.5;
    camera.position.y = 6 + Math.sin(t * 0.05) * 0.6 + mouse.y * 1.2;
    camera.position.z = 30 + Math.sin(t * 0.06) * 1;
    camera.lookAt(0, 2.5, 0);
  }

  // Bloom
  if (state === 6 && stateT < 0.8) {
    bloom.strength = 1.4 + (1 - stateT/0.8) * 2.0;
  } else {
    bloom.strength = 1.4;
  }

  composer.render();
}

tick();
</script>
</body>
</html>
