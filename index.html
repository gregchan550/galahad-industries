<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galahad Industries — Forging the Future</title>
<meta name="description" content="Galahad Industries. Enterprise AI software forged for purpose.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #050505;
    color: #e8e0d4;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    cursor: none;
  }

  canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .title {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: clamp(1.8rem, 5vw, 4.5rem);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 2s ease, filter 2s ease;
    text-align: center;
    padding: 0 1rem;
    background: linear-gradient(180deg, #ffffff 0%, #e8d5b0 40%, #c9a84c 70%, #ff8c3a 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: blur(8px);
  }

  .title.visible {
    opacity: 1;
    filter: drop-shadow(0 0 40px rgba(255, 107, 26, 0.3)) blur(0px);
  }

  .subtitle {
    font-family: 'Cinzel', serif;
    font-weight: 400;
    font-size: clamp(0.85rem, 1.8vw, 1.3rem);
    letter-spacing: 0.5em;
    text-transform: uppercase;
    margin-top: 1.5rem;
    opacity: 0;
    transition: opacity 2s ease 0.6s;
    color: #7a6f5e;
  }

  .subtitle.visible { opacity: 1; }

  .email-cta {
    margin-top: 3.5rem;
    opacity: 0;
    transition: opacity 1.5s ease 1.2s;
    pointer-events: auto;
    text-align: center;
  }

  .email-cta.visible { opacity: 1; }

  .email-cta a {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: clamp(0.65rem, 1.1vw, 0.85rem);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #5a5044;
    text-decoration: none;
    border: 1px solid rgba(90, 80, 68, 0.25);
    padding: 0.85rem 2.8rem;
    transition: all 0.5s ease;
    display: inline-block;
  }

  .email-cta a:hover {
    color: #c9a84c;
    border-color: rgba(201, 168, 76, 0.4);
    box-shadow: 0 0 40px rgba(255, 107, 26, 0.08), inset 0 0 20px rgba(255, 107, 26, 0.03);
  }

  .cursor-glow {
    position: fixed;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 10;
    background: radial-gradient(circle, rgba(255, 150, 60, 0.9) 0%, rgba(255, 107, 26, 0.4) 30%, transparent 70%);
    transform: translate(-50%, -50%);
    mix-blend-mode: screen;
    transition: opacity 0.3s;
  }

  .vignette {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 3;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(5, 5, 5, 0.8) 100%);
  }

  @media (max-width: 600px) {
    .title { letter-spacing: 0.15em; }
    .subtitle { letter-spacing: 0.25em; }
    body { cursor: auto; }
    .cursor-glow { display: none; }
  }
</style>
</head>
<body>
<canvas id="forge"></canvas>
<div class="overlay">
  <h1 class="title" id="title">Galahad Industries</h1>
  <p class="subtitle" id="subtitle">Forging the future</p>
  <div class="email-cta" id="cta">
    <a href="mailto:hello@galahad.industries">Get in touch</a>
  </div>
</div>
<div class="vignette"></div>
<div class="cursor-glow" id="cursor"></div>

<script>
(function() {
  'use strict';

  const canvas = document.getElementById('forge');
  const ctx = canvas.getContext('2d');
  const cursorEl = document.getElementById('cursor');
  const titleEl = document.getElementById('title');
  const subtitleEl = document.getElementById('subtitle');
  const ctaEl = document.getElementById('cta');

  let W, H, dpr;
  let mouse = { x: -9999, y: -9999, active: false };
  let time = 0;
  let phase = 0;
  let phaseTime = 0;
  let textRevealed = false;

  const PHASE_DELAYS = { start: 80, form: 240, hold: 150, dissolve: 120 };

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (swordBuilt) rebuildSword();
  }

  window.addEventListener('resize', resize);
  resize();

  function emberRGB(heat) {
    let r, g, b;
    if (heat > 0.7) {
      const t = (heat - 0.7) / 0.3;
      r = 255; g = 60 + (1 - t) * 50; b = 5 + (1 - t) * 15;
    } else if (heat > 0.4) {
      const t = (heat - 0.4) / 0.3;
      r = 255; g = 110 + (1 - t) * 80; b = 20 + (1 - t) * 30;
    } else if (heat > 0.15) {
      const t = (heat - 0.15) / 0.25;
      r = 220 + t * 35; g = 190 + (1 - t) * 10; b = 80 + (1 - t) * 80;
    } else {
      const t = heat / 0.15;
      r = 200 + t * 20; g = 200 - t * 10; b = 200 - t * 120;
    }
    return { r: Math.round(r), g: Math.round(g), b: Math.round(b) };
  }

  const EMBER_COUNT = 600;
  const embers = [];

  class Ember {
    constructor() { this.init(true); }

    init(scatter) {
      this.x = Math.random() * W;
      this.y = scatter ? Math.random() * H : H + 10 + Math.random() * 40;
      this.vx = (Math.random() - 0.5) * 0.6;
      this.vy = -(0.6 + Math.random() * 2.4);
      this.size = 0.6 + Math.random() * 2.2;
      this.heat = 0.6 + Math.random() * 0.4;
      this.life = scatter ? Math.random() : 1;
      this.decay = 0.001 + Math.random() * 0.003;
      this.wobble = Math.random() * Math.PI * 2;
      this.wobbleSpeed = 0.02 + Math.random() * 0.04;
      this.wobbleAmp = 0.2 + Math.random() * 0.5;
    }

    update() {
      this.wobble += this.wobbleSpeed;
      this.vx += Math.sin(this.wobble) * this.wobbleAmp * 0.02;
      this.vx *= 0.995;
      this.vy *= 0.999;

      if (mouse.active) {
        const dx = mouse.x - this.x;
        const dy = mouse.y - this.y;
        const d2 = dx * dx + dy * dy;
        const range = 22000;
        if (d2 < range) {
          const force = (range - d2) / range * 0.012;
          this.vx += dx * force;
          this.vy += dy * force;
          this.heat = Math.min(1, this.heat + 0.03);
        }
      }

      this.x += this.vx;
      this.y += this.vy;
      this.heat = Math.max(0, this.heat - 0.001);
      this.life -= this.decay;

      if (this.life <= 0 || this.y < -30 || this.x < -60 || this.x > W + 60) {
        this.init(false);
      }
    }

    draw() {
      const a = this.life * (0.5 + 0.3 * Math.sin(this.wobble * 3));
      if (a < 0.01) return;

      const { r, g, b } = emberRGB(this.heat);
      const s = this.size * (0.6 + this.heat * 0.4);

      const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, s * 5);
      grad.addColorStop(0, 'rgba(' + r + ',' + g + ',' + b + ',' + (a * 0.6) + ')');
      grad.addColorStop(0.3, 'rgba(' + r + ',' + g + ',' + b + ',' + (a * 0.15) + ')');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(this.x - s * 5, this.y - s * 5, s * 10, s * 10);

      ctx.beginPath();
      ctx.arc(this.x, this.y, s * 0.7, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + Math.min(255, r + 30) + ',' + Math.min(255, g + 30) + ',' + Math.min(255, b + 30) + ',' + (a * 0.9) + ')';
      ctx.fill();
    }
  }

  for (let i = 0; i < EMBER_COUNT; i++) embers.push(new Ember());

  const swordParts = [];
  let swordBuilt = false;
  const MAX_SWORD = 500;

  function generateSwordPoints() {
    const cx = W / 2, cy = H / 2 - H * 0.04;
    const sc = Math.min(W, H) / 850;
    const pts = [];
    const d = 2;

    const bladeH = 230 * sc, tipW = 3 * sc, baseW = 15 * sc;
    for (let row = 0; row < bladeH; row += d) {
      const t = row / bladeH;
      const w = tipW + t * (baseW - tipW);
      for (let col = -w; col <= w; col += d) {
        pts.push({ x: cx + col + (Math.random() - 0.5) * d * 0.4, y: cy - bladeH + row + (Math.random() - 0.5) * d * 0.4 });
      }
    }
    const gW = 50 * sc, gH = 7 * sc;
    for (let row = -gH; row <= gH; row += d) {
      for (let col = -gW; col <= gW; col += d) {
        pts.push({ x: cx + col + (Math.random() - 0.5), y: cy + row + (Math.random() - 0.5) });
      }
    }
    const grH = 52 * sc, grW = 6 * sc;
    for (let row = 0; row < grH; row += d) {
      for (let col = -grW; col <= grW; col += d) {
        pts.push({ x: cx + col + (Math.random() - 0.5), y: cy + gH + row + (Math.random() - 0.5) });
      }
    }
    const pomR = 11 * sc, pomCy = cy + gH + grH + pomR;
    for (let a = 0; a < Math.PI * 2; a += 0.12) {
      for (let r = 0; r < pomR; r += d) {
        pts.push({ x: cx + Math.cos(a) * r + (Math.random() - 0.5), y: pomCy + Math.sin(a) * r + (Math.random() - 0.5) });
      }
    }
    return pts;
  }

  function rebuildSword() {
    const pts = generateSwordPoints();
    const step = Math.max(1, Math.floor(pts.length / MAX_SWORD));
    swordParts.length = 0;
    for (let i = 0; i < pts.length; i += step) {
      swordParts.push(new SwordMote(pts[i].x, pts[i].y));
    }
  }

  function buildSword() {
    if (swordBuilt) return;
    swordBuilt = true;
    rebuildSword();
  }

  class SwordMote {
    constructor(tx, ty) {
      this.tx = tx; this.ty = ty;
      this.x = W / 2 + (Math.random() - 0.5) * W * 0.6;
      this.y = H * 0.7 + Math.random() * H * 0.35;
      this.vx = 0; this.vy = 0;
      this.arrived = false;
      this.heat = 1;
      this.size = 0.8 + Math.random() * 1.2;
      this.flicker = Math.random() * Math.PI * 2;
      this.alpha = 1;
      this.dissolving = false;
    }

    update(formProg, dissolveProg) {
      this.flicker += 0.07 + Math.random() * 0.03;

      if (dissolveProg > 0 && !this.dissolving) {
        this.dissolving = true;
        this.vx = (Math.random() - 0.5) * 3.5;
        this.vy = -(0.8 + Math.random() * 2.5);
      }

      if (this.dissolving) {
        this.x += this.vx;
        this.y += this.vy;
        this.vy -= 0.015;
        this.vx += (Math.random() - 0.5) * 0.2;
        this.alpha = Math.max(0, this.alpha - 0.012);
        this.heat = Math.max(0.3, this.heat - 0.005);
        return;
      }

      if (!this.arrived) {
        const dx = this.tx - this.x;
        const dy = this.ty - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        const ease = Math.min(1, formProg * 1.8);
        const pull = 0.015 + ease * 0.07;

        this.vx += dx * pull;
        this.vy += dy * pull;
        this.vx *= 0.88;
        this.vy *= 0.88;

        this.x += this.vx;
        this.y += this.vy;

        if (dist < 2.5) {
          this.arrived = true;
          this.x = this.tx;
          this.y = this.ty;
        }
      } else {
        this.x = this.tx + Math.sin(this.flicker) * 0.4;
        this.y = this.ty + Math.cos(this.flicker * 1.3) * 0.25;
        this.heat = Math.max(0.35, this.heat - 0.002);
      }
    }

    draw() {
      if (this.alpha < 0.01) return;
      const { r, g, b } = emberRGB(this.heat);
      const a = this.alpha * (0.65 + Math.sin(this.flicker) * 0.15);
      const s = this.size;

      const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, s * 4);
      grad.addColorStop(0, 'rgba(' + r + ',' + g + ',' + b + ',' + (a * 0.7) + ')');
      grad.addColorStop(0.4, 'rgba(' + r + ',' + g + ',' + b + ',' + (a * 0.2) + ')');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(this.x - s * 4, this.y - s * 4, s * 8, s * 8);

      ctx.beginPath();
      ctx.arc(this.x, this.y, s * 0.5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,' + Math.min(255, g + 60) + ',' + Math.min(255, b + 80) + ',' + (a * 0.85) + ')';
      ctx.fill();
    }
  }

  function drawForgeGlow() {
    const g1 = ctx.createRadialGradient(W / 2, H + 50, 0, W / 2, H + 50, H * 0.7);
    g1.addColorStop(0, 'rgba(255, 60, 5, 0.06)');
    g1.addColorStop(0.3, 'rgba(200, 40, 0, 0.03)');
    g1.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g1;
    ctx.fillRect(0, 0, W, H);

    const pulse = 0.5 + 0.5 * Math.sin(time * 0.008);
    const g2 = ctx.createRadialGradient(W / 2, H, 0, W / 2, H, H * 0.5);
    g2.addColorStop(0, 'rgba(255, 80, 15, ' + (0.03 * pulse) + ')');
    g2.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g2;
    ctx.fillRect(0, 0, W, H);
  }

  function drawHeatDistortion() {
    ctx.save();
    ctx.globalAlpha = 0.012;
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 4; i++) {
      const x = W * 0.3 + Math.sin(time * 0.002 + i * 1.7) * W * 0.25;
      const w = 50 + Math.sin(time * 0.004 + i * 2.3) * 20;
      const grad = ctx.createLinearGradient(x - w, 0, x + w, 0);
      grad.addColorStop(0, 'rgba(255,90,20,0)');
      grad.addColorStop(0.5, 'rgba(255,90,20,1)');
      grad.addColorStop(1, 'rgba(255,90,20,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(x - w, H * 0.55 + Math.sin(time * 0.006 + i) * 25, w * 2, H * 0.45);
    }
    ctx.restore();
  }

  function drawSwordAura(intensity) {
    if (intensity <= 0.01) return;
    const cx = W / 2, cy = H / 2 - H * 0.04;
    const sc = Math.min(W, H) / 850;
    const bladeH = 230 * sc;

    const grad = ctx.createRadialGradient(cx, cy - bladeH * 0.3, 0, cx, cy - bladeH * 0.3, bladeH);
    grad.addColorStop(0, 'rgba(255, 130, 40, ' + (0.05 * intensity) + ')');
    grad.addColorStop(0.4, 'rgba(255, 80, 15, ' + (0.025 * intensity) + ')');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  function drawMouseBloom() {
    if (!mouse.active) return;
    const grad = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 140);
    grad.addColorStop(0, 'rgba(255, 130, 40, 0.04)');
    grad.addColorStop(0.4, 'rgba(255, 80, 15, 0.015)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(mouse.x - 140, mouse.y - 140, 280, 280);
  }

  function frame() {
    time++;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#050505';
    ctx.fillRect(0, 0, W, H);

    drawForgeGlow();
    drawHeatDistortion();

    if (phase === 0 && time > PHASE_DELAYS.start) {
      phase = 1; phaseTime = 0;
      buildSword();
    }
    if (phase === 1) {
      phaseTime++;
      if (phaseTime > PHASE_DELAYS.form) { phase = 2; phaseTime = 0; }
    }
    if (phase === 2) {
      phaseTime++;
      if (phaseTime > PHASE_DELAYS.hold) { phase = 3; phaseTime = 0; }
    }
    if (phase === 3) {
      phaseTime++;
      if (phaseTime > PHASE_DELAYS.dissolve && !textRevealed) {
        textRevealed = true;
        titleEl.classList.add('visible');
        subtitleEl.classList.add('visible');
        ctaEl.classList.add('visible');
        phase = 4; phaseTime = 0;
      }
    }

    for (let i = 0; i < embers.length; i++) {
      embers[i].update();
      embers[i].draw();
    }

    if (phase >= 1 && phase <= 3) {
      const fp = phase === 1 ? phaseTime / PHASE_DELAYS.form : 1;
      const dp = phase === 3 ? phaseTime / PHASE_DELAYS.dissolve : 0;
      const aura = phase === 1 ? fp : phase === 2 ? 1 : Math.max(0, 1 - dp);
      drawSwordAura(aura);

      for (let i = 0; i < swordParts.length; i++) {
        swordParts[i].update(fp, dp);
        swordParts[i].draw();
      }
    }

    drawMouseBloom();
    requestAnimationFrame(frame);
  }

  document.addEventListener('mousemove', function(e) {
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
    cursorEl.style.left = e.clientX + 'px';
    cursorEl.style.top = e.clientY + 'px';
    cursorEl.style.opacity = '1';
  });
  document.addEventListener('mouseleave', function() { mouse.active = false; cursorEl.style.opacity = '0'; });
  document.addEventListener('touchmove', function(e) {
    e.preventDefault();
    mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; mouse.active = true;
  }, { passive: false });
  document.addEventListener('touchend', function() { mouse.active = false; });

  if ('ontouchstart' in window) {
    document.body.style.cursor = 'auto';
    cursorEl.style.display = 'none';
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
