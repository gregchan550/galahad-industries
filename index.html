<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galahad Industries</title>
<meta name="description" content="Enterprise AI software. The seat is taken.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Inter:wght@200;300;400&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    color: #e8e8e8;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    font-family: 'Inter', -apple-system, sans-serif;
  }

  canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .title {
    font-family: 'Cormorant Garamond', 'Georgia', serif;
    font-weight: 300;
    font-size: clamp(2rem, 6vw, 5rem);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #c9a84c;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 1.8s ease, transform 1.8s ease;
    text-shadow: 0 0 60px rgba(201, 168, 76, 0.3), 0 0 120px rgba(201, 168, 76, 0.1);
    text-align: center;
    padding: 0 1rem;
  }

  .title.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .tagline {
    font-family: 'Inter', sans-serif;
    font-weight: 200;
    font-size: clamp(0.85rem, 1.8vw, 1.15rem);
    letter-spacing: 0.25em;
    color: rgba(201, 168, 76, 0.55);
    margin-top: 1.2rem;
    opacity: 0;
    transform: translateY(15px);
    transition: opacity 2s ease 0.4s, transform 2s ease 0.4s;
  }

  .tagline.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .divider {
    width: clamp(40px, 8vw, 80px);
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201, 168, 76, 0.4), transparent);
    margin-top: 2.5rem;
    opacity: 0;
    transition: opacity 2.5s ease 0.8s;
  }

  .divider.visible { opacity: 1; }

  .contact {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: clamp(0.65rem, 1.1vw, 0.8rem);
    letter-spacing: 0.15em;
    color: rgba(255, 255, 255, 0.2);
    margin-top: 2rem;
    opacity: 0;
    transition: opacity 3s ease 1.2s;
    pointer-events: auto;
  }

  .contact.visible { opacity: 1; }

  .contact a {
    color: rgba(201, 168, 76, 0.4);
    text-decoration: none;
    transition: color 0.3s ease;
  }

  .contact a:hover { color: rgba(201, 168, 76, 0.8); }

  .vignette {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 5;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%);
  }

  .scan-line {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 6;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0, 0, 0, 0.015) 2px,
      rgba(0, 0, 0, 0.015) 4px
    );
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div class="vignette"></div>
<div class="scan-line"></div>

<div class="overlay">
  <div class="title" id="title">Galahad Industries</div>
  <div class="tagline" id="tagline">The seat is taken.</div>
  <div class="divider" id="divider"></div>
  <div class="contact" id="contact">Inquiries &mdash; <a href="mailto:greg@galahad.industries">greg@galahad.industries</a></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// --- Config ---
const PARTICLE_COUNT = 1800;
const CONNECTION_DISTANCE = 0.12;
const GOLD = new THREE.Color(0xc9a84c);
const DIM_GOLD = new THREE.Color(0x3d2f12);
const DARK = new THREE.Color(0x1a1510);

// --- Phases ---
const PHASE = { DRIFT: 0, CONVERGE: 1, THRONE: 2, SCATTER: 3, TEXT: 4, AMBIENT: 5 };
let phase = PHASE.DRIFT;
let phaseTime = 0;
const PHASE_DURATIONS = { 0: 3.0, 1: 3.5, 2: 2.8, 3: 1.8, 4: 1.5 };

// --- Scene ---
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x0a0a0a, 1);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.z = 3;

// --- Mouse ---
const mouse = new THREE.Vector2(0, 0);
const mouseWorld = new THREE.Vector3(0, 0, 0);
window.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  mouseWorld.set(mouse.x * 2.5, mouse.y * 1.8, 0);
});
window.addEventListener('touchmove', (e) => {
  const t = e.touches[0];
  mouse.x = (t.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(t.clientY / window.innerHeight) * 2 + 1;
  mouseWorld.set(mouse.x * 2.5, mouse.y * 1.8, 0);
}, { passive: true });

// --- Throne geometry (Siege Perilous silhouette) ---
function generateThronePoints(count) {
  const points = [];
  const w = 0.55, h = 0.9;
  const seatY = -0.15;

  function line(x1, y1, x2, y2, n, scatter = 0.015) {
    for (let i = 0; i < n; i++) {
      const t = i / n;
      points.push(new THREE.Vector3(
        THREE.MathUtils.lerp(x1, x2, t) + (Math.random() - 0.5) * scatter,
        THREE.MathUtils.lerp(y1, y2, t) + (Math.random() - 0.5) * scatter,
        (Math.random() - 0.5) * 0.08
      ));
    }
  }

  function arc(cx, cy, r, startAngle, endAngle, n, scatter = 0.015) {
    for (let i = 0; i < n; i++) {
      const t = i / n;
      const a = THREE.MathUtils.lerp(startAngle, endAngle, t);
      points.push(new THREE.Vector3(
        cx + Math.cos(a) * r + (Math.random() - 0.5) * scatter,
        cy + Math.sin(a) * r + (Math.random() - 0.5) * scatter,
        (Math.random() - 0.5) * 0.08
      ));
    }
  }

  const density = count / 600;

  // Tall back - pointed Gothic arch
  arc(0, h * 0.45, w * 0.5, Math.PI * 0.15, Math.PI * 0.85, Math.floor(80 * density), 0.02);
  // Peak finial
  line(0, h * 0.88, 0, h * 1.05, Math.floor(25 * density), 0.008);
  // Small cross at top
  line(-0.04, h * 1.02, 0.04, h * 1.02, Math.floor(10 * density), 0.005);

  // Back vertical sides
  line(-w * 0.48, seatY + 0.1, -w * 0.38, h * 0.75, Math.floor(60 * density));
  line(w * 0.48, seatY + 0.1, w * 0.38, h * 0.75, Math.floor(60 * density));

  // Inner tracery - Gothic window pattern
  arc(0, h * 0.35, w * 0.28, Math.PI * 0.2, Math.PI * 0.8, Math.floor(40 * density), 0.01);
  line(-w * 0.12, seatY + 0.15, -w * 0.08, h * 0.55, Math.floor(30 * density), 0.008);
  line(w * 0.12, seatY + 0.15, w * 0.08, h * 0.55, Math.floor(30 * density), 0.008);
  // Central vertical
  line(0, seatY + 0.08, 0, h * 0.62, Math.floor(35 * density), 0.006);

  // Armrests
  line(-w * 0.48, seatY, -w * 0.72, seatY + 0.08, Math.floor(30 * density));
  line(w * 0.48, seatY, w * 0.72, seatY + 0.08, Math.floor(30 * density));
  // Armrest caps
  for (let i = 0; i < Math.floor(15 * density); i++) {
    const a = Math.random() * Math.PI * 2;
    const r = Math.random() * 0.03;
    points.push(new THREE.Vector3(-w * 0.72 + Math.cos(a) * r, seatY + 0.08 + Math.sin(a) * r, (Math.random() - 0.5) * 0.04));
    points.push(new THREE.Vector3(w * 0.72 + Math.cos(a) * r, seatY + 0.08 + Math.sin(a) * r, (Math.random() - 0.5) * 0.04));
  }

  // Seat
  line(-w * 0.48, seatY, w * 0.48, seatY, Math.floor(40 * density));

  // Front legs - tapered
  line(-w * 0.48, seatY, -w * 0.55, -h * 0.7, Math.floor(45 * density));
  line(w * 0.48, seatY, w * 0.55, -h * 0.7, Math.floor(45 * density));
  // Back legs
  line(-w * 0.42, seatY, -w * 0.45, -h * 0.68, Math.floor(35 * density));
  line(w * 0.42, seatY, w * 0.45, -h * 0.68, Math.floor(35 * density));

  // Leg crossbar
  line(-w * 0.5, -h * 0.35, w * 0.5, -h * 0.35, Math.floor(30 * density));

  // Base platform
  line(-w * 0.65, -h * 0.7, w * 0.65, -h * 0.7, Math.floor(35 * density));
  line(-w * 0.65, -h * 0.73, w * 0.65, -h * 0.73, Math.floor(25 * density));

  // Ambient particles around throne (glow aura)
  for (let i = 0; i < Math.floor(80 * density); i++) {
    const angle = Math.random() * Math.PI * 2;
    const radius = 0.6 + Math.random() * 0.5;
    const yOff = (Math.random() - 0.3) * 1.2;
    points.push(new THREE.Vector3(
      Math.cos(angle) * radius * 0.7,
      yOff,
      Math.sin(angle) * 0.15 + (Math.random() - 0.5) * 0.1
    ));
  }

  // Fill to count
  while (points.length < count) {
    const src = points[Math.floor(Math.random() * points.length)];
    points.push(new THREE.Vector3(
      src.x + (Math.random() - 0.5) * 0.03,
      src.y + (Math.random() - 0.5) * 0.03,
      src.z + (Math.random() - 0.5) * 0.03
    ));
  }
  return points.slice(0, count);
}

// --- Particles ---
const throneTargets = generateThronePoints(PARTICLE_COUNT);

const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(PARTICLE_COUNT * 3);
const colors = new Float32Array(PARTICLE_COUNT * 3);
const sizes = new Float32Array(PARTICLE_COUNT);
const velocities = new Float32Array(PARTICLE_COUNT * 3);
const phaseOffsets = new Float32Array(PARTICLE_COUNT);

for (let i = 0; i < PARTICLE_COUNT; i++) {
  const i3 = i * 3;
  positions[i3] = (Math.random() - 0.5) * 6;
  positions[i3 + 1] = (Math.random() - 0.5) * 4;
  positions[i3 + 2] = (Math.random() - 0.5) * 2;

  velocities[i3] = (Math.random() - 0.5) * 0.002;
  velocities[i3 + 1] = (Math.random() - 0.5) * 0.002;
  velocities[i3 + 2] = (Math.random() - 0.5) * 0.001;

  phaseOffsets[i] = Math.random() * Math.PI * 2;

  const c = DIM_GOLD.clone().lerp(DARK, Math.random() * 0.7);
  colors[i3] = c.r;
  colors[i3 + 1] = c.g;
  colors[i3 + 2] = c.b;

  sizes[i] = 1.5 + Math.random() * 2;
}

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

const particleMaterial = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uPixelRatio: { value: renderer.getPixelRatio() },
  },
  vertexShader: `
    attribute float size;
    varying vec3 vColor;
    uniform float uTime;
    uniform float uPixelRatio;
    void main() {
      vColor = color;
      vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * uPixelRatio * (2.0 / -mvPos.z);
      gl_Position = projectionMatrix * mvPos;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      float alpha = smoothstep(0.5, 0.1, d);
      alpha *= alpha;
      gl_FragColor = vec4(vColor, alpha);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexColors: true,
});

const particles = new THREE.Points(geometry, particleMaterial);
scene.add(particles);

// --- Connection lines ---
const MAX_LINES = 6000;
const lineGeo = new THREE.BufferGeometry();
const linePositions = new Float32Array(MAX_LINES * 6);
const lineColors = new Float32Array(MAX_LINES * 6);
lineGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
lineGeo.setAttribute('color', new THREE.BufferAttribute(lineColors, 3));
lineGeo.setDrawRange(0, 0);

const lineMaterial = new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.6,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});

const lineSegments = new THREE.LineSegments(lineGeo, lineMaterial);
scene.add(lineSegments);

// --- Ambient glow plane ---
const glowGeo = new THREE.PlaneGeometry(8, 8);
const glowMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uIntensity: { value: 0 },
  },
  vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform float uTime;
    uniform float uIntensity;
    varying vec2 vUv;
    void main() {
      vec2 center = vec2(0.5, 0.55);
      float d = distance(vUv, center);
      float glow = exp(-d * 3.0) * uIntensity * 0.12;
      glow += exp(-d * 8.0) * uIntensity * 0.08;
      vec3 col = vec3(0.79, 0.66, 0.30) * glow;
      gl_FragColor = vec4(col, glow);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
});
const glowPlane = new THREE.Mesh(glowGeo, glowMat);
glowPlane.position.z = -0.5;
scene.add(glowPlane);

// --- Scatter targets (post-throne) ---
const scatterTargets = [];
for (let i = 0; i < PARTICLE_COUNT; i++) {
  scatterTargets.push(new THREE.Vector3(
    (Math.random() - 0.5) * 7,
    (Math.random() - 0.5) * 5,
    (Math.random() - 0.5) * 3
  ));
}

// --- Animation ---
const clock = new THREE.Clock();
let elapsed = 0;
let connectionDist = 0;
let throneIntensity = 0;

function setPhase(newPhase) {
  phase = newPhase;
  phaseTime = 0;
}

function updateConnections() {
  const pos = geometry.attributes.position.array;
  let lineIdx = 0;
  const dist2 = connectionDist * connectionDist;

  if (connectionDist < 0.01) {
    lineGeo.setDrawRange(0, 0);
    return;
  }

  const cellSize = connectionDist;
  const cells = new Map();

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const x = pos[i * 3], y = pos[i * 3 + 1];
    const cx = Math.floor(x / cellSize), cy = Math.floor(y / cellSize);
    const key = cx + ',' + cy;
    if (!cells.has(key)) cells.set(key, []);
    cells.get(key).push(i);
  }

  for (const [key, indices] of cells) {
    const [cx, cy] = key.split(',').map(Number);

    for (let dx = -1; dx <= 1; dx++) {
      for (let dy = -1; dy <= 1; dy++) {
        const nKey = (cx + dx) + ',' + (cy + dy);
        const neighbors = cells.get(nKey);
        if (!neighbors) continue;

        for (const i of indices) {
          for (const j of neighbors) {
            if (j <= i) continue;
            if (lineIdx >= MAX_LINES) break;

            const ix = i * 3, jx = j * 3;
            const ddx = pos[ix] - pos[jx];
            const ddy = pos[ix + 1] - pos[jx + 1];
            const ddz = pos[ix + 2] - pos[jx + 2];
            const d2 = ddx * ddx + ddy * ddy + ddz * ddz;

            if (d2 < dist2) {
              const alpha = 1 - Math.sqrt(d2) / connectionDist;
              const col = GOLD.clone().multiplyScalar(alpha * 0.35 * throneIntensity);
              const li = lineIdx * 6;
              linePositions[li] = pos[ix];
              linePositions[li + 1] = pos[ix + 1];
              linePositions[li + 2] = pos[ix + 2];
              linePositions[li + 3] = pos[jx];
              linePositions[li + 4] = pos[jx + 1];
              linePositions[li + 5] = pos[jx + 2];

              lineColors[li] = col.r; lineColors[li + 1] = col.g; lineColors[li + 2] = col.b;
              lineColors[li + 3] = col.r; lineColors[li + 4] = col.g; lineColors[li + 5] = col.b;
              lineIdx++;
            }
          }
        }
      }
    }
  }

  lineGeo.attributes.position.needsUpdate = true;
  lineGeo.attributes.color.needsUpdate = true;
  lineGeo.setDrawRange(0, lineIdx * 2);
}

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.05);
  elapsed += delta;
  phaseTime += delta;

  particleMaterial.uniforms.uTime.value = elapsed;
  glowMat.uniforms.uTime.value = elapsed;

  const pos = geometry.attributes.position.array;
  const col = geometry.attributes.color.array;
  const sz = geometry.attributes.size.array;

  // Phase transitions
  if (phase === PHASE.DRIFT && phaseTime > PHASE_DURATIONS[0]) setPhase(PHASE.CONVERGE);
  if (phase === PHASE.CONVERGE && phaseTime > PHASE_DURATIONS[1]) setPhase(PHASE.THRONE);
  if (phase === PHASE.THRONE && phaseTime > PHASE_DURATIONS[2]) setPhase(PHASE.SCATTER);
  if (phase === PHASE.SCATTER && phaseTime > PHASE_DURATIONS[3]) setPhase(PHASE.TEXT);
  if (phase === PHASE.TEXT && phaseTime > PHASE_DURATIONS[4]) setPhase(PHASE.AMBIENT);

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const i3 = i * 3;
    const px = pos[i3], py = pos[i3 + 1], pz = pos[i3 + 2];
    const pOff = phaseOffsets[i];

    if (phase === PHASE.DRIFT) {
      pos[i3] += velocities[i3] + Math.sin(elapsed * 0.3 + pOff) * 0.0003;
      pos[i3 + 1] += velocities[i3 + 1] + Math.cos(elapsed * 0.2 + pOff) * 0.0003;
      pos[i3 + 2] += velocities[i3 + 2];

      const fadeIn = Math.min(phaseTime / 2.0, 1.0);
      const c = DIM_GOLD.clone().lerp(DARK, 0.5 - fadeIn * 0.3);
      col[i3] = c.r; col[i3 + 1] = c.g; col[i3 + 2] = c.b;
      sz[i] = (1.5 + Math.random() * 0.5) * fadeIn;

      connectionDist = 0;
      throneIntensity = 0;
    }

    else if (phase === PHASE.CONVERGE) {
      const t = Math.min(phaseTime / PHASE_DURATIONS[1], 1.0);
      const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      const target = throneTargets[i];

      pos[i3] += (target.x - px) * ease * 0.04;
      pos[i3 + 1] += (target.y - py) * ease * 0.04;
      pos[i3 + 2] += (target.z - pz) * ease * 0.04;

      const bright = ease * 0.8;
      const c = DIM_GOLD.clone().lerp(GOLD, bright);
      col[i3] = c.r; col[i3 + 1] = c.g; col[i3 + 2] = c.b;
      sz[i] = 1.5 + bright * 2;

      connectionDist = CONNECTION_DISTANCE * ease;
      throneIntensity = ease;
    }

    else if (phase === PHASE.THRONE) {
      const target = throneTargets[i];
      const breathe = Math.sin(elapsed * 1.5 + pOff) * 0.003;

      pos[i3] += (target.x - px) * 0.08 + breathe;
      pos[i3 + 1] += (target.y - py) * 0.08 + Math.cos(elapsed * 1.2 + pOff) * 0.002;
      pos[i3 + 2] += (target.z - pz) * 0.08;

      const pulse = 0.85 + Math.sin(elapsed * 2 + pOff) * 0.15;
      const c = GOLD.clone().multiplyScalar(pulse);
      col[i3] = c.r; col[i3 + 1] = c.g; col[i3 + 2] = c.b;
      sz[i] = 2.5 + Math.sin(elapsed * 1.8 + pOff) * 0.8;

      connectionDist = CONNECTION_DISTANCE;
      throneIntensity = 1;

      glowMat.uniforms.uIntensity.value = 1.0 + Math.sin(elapsed * 1.5) * 0.2;
    }

    else if (phase === PHASE.SCATTER) {
      const t = Math.min(phaseTime / PHASE_DURATIONS[3], 1.0);
      const ease = 1 - Math.pow(1 - t, 3);
      const target = scatterTargets[i];

      pos[i3] += (target.x - px) * ease * 0.06;
      pos[i3 + 1] += (target.y - py) * ease * 0.06;
      pos[i3 + 2] += (target.z - pz) * ease * 0.06;

      const fade = 1 - ease;
      const c = GOLD.clone().lerp(DIM_GOLD, ease);
      col[i3] = c.r; col[i3 + 1] = c.g; col[i3 + 2] = c.b;
      sz[i] = 2.5 * fade + 1.5;

      connectionDist = CONNECTION_DISTANCE * fade;
      throneIntensity = fade;
      glowMat.uniforms.uIntensity.value = fade;
    }

    else if (phase === PHASE.TEXT || phase === PHASE.AMBIENT) {
      pos[i3] += Math.sin(elapsed * 0.15 + pOff) * 0.0008;
      pos[i3 + 1] += Math.cos(elapsed * 0.12 + pOff * 1.3) * 0.0008;
      pos[i3 + 2] += Math.sin(elapsed * 0.1 + pOff * 0.7) * 0.0004;

      // Mouse interaction - particles gently flee
      const dx = px - mouseWorld.x;
      const dy = py - mouseWorld.y;
      const md = Math.sqrt(dx * dx + dy * dy);
      if (md < 0.8) {
        const force = (0.8 - md) * 0.003;
        pos[i3] += (dx / md) * force;
        pos[i3 + 1] += (dy / md) * force;
      }

      const twinkle = 0.5 + Math.sin(elapsed * 0.8 + pOff * 2) * 0.2;
      const c = DIM_GOLD.clone().lerp(GOLD, twinkle * 0.25);
      col[i3] = c.r; col[i3 + 1] = c.g; col[i3 + 2] = c.b;
      sz[i] = 1.2 + twinkle * 1.2;

      // Neural connections near mouse
      if (md < 1.2) {
        connectionDist = CONNECTION_DISTANCE * 0.5 * (1.2 - md) / 1.2;
        throneIntensity = 0.3 * (1.2 - md) / 1.2;
      } else {
        connectionDist = Math.max(connectionDist * 0.95, 0);
        throneIntensity = Math.max(throneIntensity * 0.95, 0);
      }

      glowMat.uniforms.uIntensity.value *= 0.98;
    }

    // Bounds
    if (Math.abs(pos[i3]) > 4) pos[i3] *= 0.99;
    if (Math.abs(pos[i3 + 1]) > 3) pos[i3 + 1] *= 0.99;
  }

  geometry.attributes.position.needsUpdate = true;
  geometry.attributes.color.needsUpdate = true;
  geometry.attributes.size.needsUpdate = true;

  // Connections
  if (connectionDist > 0.01) {
    updateConnections();
  } else {
    lineGeo.setDrawRange(0, 0);
  }

  // Show text
  if (phase === PHASE.TEXT && phaseTime > 0.3) {
    document.getElementById('title').classList.add('visible');
    document.getElementById('tagline').classList.add('visible');
    document.getElementById('divider').classList.add('visible');
    document.getElementById('contact').classList.add('visible');
  }

  // Camera sway
  camera.position.x = Math.sin(elapsed * 0.08) * 0.05;
  camera.position.y = Math.cos(elapsed * 0.06) * 0.03;
  camera.lookAt(0, 0.05, 0);

  renderer.render(scene, camera);
}

// --- Resize ---
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  particleMaterial.uniforms.uPixelRatio.value = renderer.getPixelRatio();
});

// --- Start ---
animate();
</script>
</body>
</html>
