<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galahad Industries</title>
<meta name="description" content="Galahad Industries — Enterprise AI software. Systems initializing.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Inter:wght@300;400;600;700&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --amber: #c9a84c;
    --amber-glow: rgba(201, 168, 76, 0.4);
    --blue: #4a9eff;
    --blue-glow: rgba(74, 158, 255, 0.3);
    --bg: #0a0a0c;
    --text-dim: rgba(255, 255, 255, 0.4);
    --text-mid: rgba(255, 255, 255, 0.6);
    --text-bright: rgba(255, 255, 255, 0.9);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: 'JetBrains Mono', monospace;
  }

  /* === BOOT SEQUENCE === */
  #boot-screen {
    position: fixed; inset: 0;
    background: var(--bg);
    z-index: 100;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 40px;
    overflow: hidden;
    transition: opacity 0.8s ease;
  }

  #boot-screen.fade-out {
    opacity: 0;
    pointer-events: none;
  }

  .boot-line {
    font-size: clamp(11px, 1.4vw, 14px);
    line-height: 1.7;
    color: var(--blue);
    opacity: 0;
    transform: translateY(2px);
    white-space: nowrap;
    overflow: hidden;
  }

  .boot-line.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .boot-line .prefix {
    color: rgba(74, 158, 255, 0.5);
  }

  .boot-line .highlight {
    color: var(--amber);
  }

  .boot-line .success {
    color: #4ade80;
  }

  .boot-line .warn {
    color: var(--amber);
  }

  #cursor-init {
    display: inline-block;
    width: 8px;
    height: 16px;
    background: var(--blue);
    animation: blink 0.6s step-end infinite;
    margin-top: 40vh;
    margin-left: 2px;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .init-text {
    font-size: clamp(13px, 1.6vw, 16px);
    color: var(--blue);
    display: inline;
    letter-spacing: 2px;
  }

  #init-line {
    margin-top: 40vh;
    transition: margin-top 0.5s ease;
  }

  #init-line.shifted {
    margin-top: 20px;
  }

  /* === MAIN SCENE === */
  #main-scene {
    position: fixed; inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 1.5s ease;
    z-index: 50;
  }

  #main-scene.visible {
    opacity: 1;
  }

  /* Grid background */
  #grid-canvas {
    position: fixed; inset: 0;
    z-index: 1;
  }

  /* Crest container */
  .crest-container {
    position: relative;
    z-index: 10;
    width: clamp(140px, 22vw, 220px);
    height: clamp(160px, 25vw, 260px);
    margin-bottom: 40px;
  }

  .crest-svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 30px var(--amber-glow));
    animation: crest-breathe 4s ease-in-out infinite;
  }

  @keyframes crest-breathe {
    0%, 100% { filter: drop-shadow(0 0 20px var(--amber-glow)); }
    50% { filter: drop-shadow(0 0 40px var(--amber-glow)) drop-shadow(0 0 60px rgba(201, 168, 76, 0.15)); }
  }

  .crest-svg .crest-line {
    fill: none;
    stroke: var(--amber);
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;
    animation: draw-crest 2.5s ease forwards;
  }

  .crest-svg .crest-fill {
    fill: var(--amber);
    opacity: 0;
    animation: fade-in-crest 1s ease 2s forwards;
  }

  .crest-svg .inner-glow {
    fill: none;
    stroke: var(--amber);
    stroke-width: 0.5;
    opacity: 0;
    animation: fade-in-crest 1.5s ease 2.2s forwards;
  }

  @keyframes draw-crest {
    to { stroke-dashoffset: 0; }
  }

  @keyframes fade-in-crest {
    to { opacity: 0.6; }
  }

  /* Title */
  .title-container {
    position: relative;
    z-index: 10;
    text-align: center;
  }

  .company-name {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: clamp(24px, 4.5vw, 52px);
    letter-spacing: clamp(8px, 1.5vw, 20px);
    color: var(--text-bright);
    opacity: 0;
    animation: title-appear 2s ease 0.5s forwards;
    text-transform: uppercase;
    text-shadow: 0 0 40px rgba(255, 255, 255, 0.1);
  }

  @keyframes title-appear {
    0% { opacity: 0; letter-spacing: clamp(14px, 2.5vw, 30px); filter: blur(4px); }
    100% { opacity: 1; letter-spacing: clamp(8px, 1.5vw, 20px); filter: blur(0); }
  }

  .tagline {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 300;
    font-size: clamp(11px, 1.3vw, 15px);
    color: var(--blue);
    opacity: 0;
    margin-top: 20px;
    letter-spacing: 3px;
    animation: status-appear 1.5s ease 1.5s forwards;
  }

  @keyframes status-appear {
    0% { opacity: 0; transform: translateY(8px); }
    100% { opacity: 0.8; transform: translateY(0); }
  }

  .divider {
    width: clamp(40px, 8vw, 80px);
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--amber), transparent);
    margin: 24px auto;
    opacity: 0;
    animation: status-appear 1s ease 1.2s forwards;
  }

  /* Bottom info */
  .bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0; right: 0;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 40px;
    opacity: 0;
    animation: status-appear 1s ease 2.5s forwards;
  }

  .bottom-bar span {
    font-size: clamp(9px, 1vw, 11px);
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .status-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--blue);
    margin-right: 8px;
    animation: pulse-dot 2s ease-in-out infinite;
    vertical-align: middle;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 0.5; box-shadow: 0 0 4px var(--blue-glow); }
    50% { opacity: 1; box-shadow: 0 0 12px var(--blue-glow); }
  }

  /* Scanline overlay */
  .scanlines {
    position: fixed; inset: 0;
    z-index: 90;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.03) 2px,
      rgba(0,0,0,0.03) 4px
    );
  }

  /* Vignette */
  .vignette {
    position: fixed; inset: 0;
    z-index: 80;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%);
  }

  @media (max-width: 600px) {
    #boot-screen { padding: 20px; }
    .bottom-bar { padding: 15px 20px; flex-direction: column; gap: 8px; }
    .crest-container { margin-bottom: 24px; }
  }
</style>
</head>
<body>

<!-- Boot sequence -->
<div id="boot-screen">
  <div id="init-line">
    <span class="init-text" id="init-text"></span><span id="cursor-init"></span>
  </div>
  <div id="boot-log" style="margin-top: 16px;"></div>
</div>

<!-- Main scene -->
<div id="main-scene">
  <canvas id="grid-canvas"></canvas>

  <div class="crest-container">
    <svg class="crest-svg" viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
      <!-- Shield outline -->
      <path class="crest-line" d="M100 10 L185 50 L185 140 Q185 190 100 230 Q15 190 15 140 L15 50 Z" style="animation-delay: 0s;" />
      <!-- Inner shield border -->
      <path class="crest-line" d="M100 25 L172 60 L172 138 Q172 182 100 218 Q28 182 28 138 L28 60 Z" style="animation-delay: 0.3s; stroke-width: 0.8; opacity: 0.5;" />
      <!-- Sword vertical -->
      <line class="crest-line" x1="100" y1="55" x2="100" y2="195" style="animation-delay: 0.8s; stroke-width: 1.2;" />
      <!-- Sword crossguard -->
      <line class="crest-line" x1="72" y1="95" x2="128" y2="95" style="animation-delay: 1.1s; stroke-width: 1.2;" />
      <!-- Sword pommel -->
      <circle class="crest-fill" cx="100" cy="55" r="4" style="animation-delay: 1.3s;" />
      <!-- Crown / circuit nodes top -->
      <circle class="crest-fill" cx="100" cy="75" r="2" />
      <circle class="crest-fill" cx="72" cy="95" r="2.5" />
      <circle class="crest-fill" cx="128" cy="95" r="2.5" />
      <!-- Circuit trace left -->
      <path class="crest-line inner-glow" d="M72 95 L55 120 L55 155 L75 175" style="animation-delay: 1.5s; stroke-width: 0.8;" />
      <!-- Circuit trace right -->
      <path class="crest-line inner-glow" d="M128 95 L145 120 L145 155 L125 175" style="animation-delay: 1.6s; stroke-width: 0.8;" />
      <!-- Lower nodes -->
      <circle class="crest-fill" cx="75" cy="175" r="2" />
      <circle class="crest-fill" cx="125" cy="175" r="2" />
      <circle class="crest-fill" cx="100" cy="195" r="3" />
      <!-- Data flow dots along sword -->
      <circle class="crest-fill" cx="100" cy="115" r="1.5" style="animation: fade-in-crest 0.5s ease 1.8s forwards, data-flow 3s ease-in-out 2.5s infinite;" />
      <circle class="crest-fill" cx="100" cy="140" r="1.5" style="animation: fade-in-crest 0.5s ease 2s forwards, data-flow 3s ease-in-out 2.8s infinite;" />
      <circle class="crest-fill" cx="100" cy="165" r="1.5" style="animation: fade-in-crest 0.5s ease 2.2s forwards, data-flow 3s ease-in-out 3.1s infinite;" />
      <!-- Horizontal detail lines -->
      <line class="crest-line inner-glow" x1="60" y1="140" x2="85" y2="140" style="animation-delay: 1.8s; stroke-width: 0.5;" />
      <line class="crest-line inner-glow" x1="115" y1="140" x2="140" y2="140" style="animation-delay: 1.9s; stroke-width: 0.5;" />
    </svg>
    <style>
      @keyframes data-flow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.9; }
      }
    </style>
  </div>

  <div class="title-container">
    <div class="company-name">Galahad Industries</div>
    <div class="divider"></div>
    <div class="tagline">Systems online.</div>
  </div>

  <div class="bottom-bar">
    <span><span class="status-dot"></span>All systems nominal</span>
    <span>Est. 2026 &mdash; Brisbane, AU</span>
  </div>
</div>

<div class="scanlines"></div>
<div class="vignette"></div>

<script>
(function() {
  const bootScreen = document.getElementById('boot-screen');
  const mainScene = document.getElementById('main-scene');
  const initText = document.getElementById('init-text');
  const initLine = document.getElementById('init-line');
  const cursorInit = document.getElementById('cursor-init');
  const bootLog = document.getElementById('boot-log');

  // Boot messages
  const bootMessages = [
    { text: '[CORE]  Loading neural cores...', delay: 60 },
    { text: '[CORE]  4 inference engines allocated', delay: 40, cls: 'success' },
    { text: '[MEM]   Initializing knowledge graph...', delay: 55 },
    { text: '[MEM]   Vector store mounted — 2.4M embeddings', delay: 45, cls: 'success' },
    { text: '[NET]   Connecting secure mesh network...', delay: 50 },
    { text: '[NET]   Encrypted channels established', delay: 40, cls: 'success' },
    { text: '[SYS]   Calibrating inference engine...', delay: 55 },
    { text: '[SYS]   Model weights verified — integrity OK', delay: 40, cls: 'success' },
    { text: '[AUTH]  Loading quest parameters...', delay: 60 },
    { text: '[AUTH]  Directive: Undercut legacy enterprise by 3-5x', delay: 45, cls: 'warn' },
    { text: '[PLAN]  Target sectors: ERP, CRM, Supply Chain', delay: 50 },
    { text: '[PLAN]  Competitive analysis loaded', delay: 40, cls: 'success' },
    { text: '[AGI]   Reasoning modules online', delay: 55 },
    { text: '[AGI]   Agentic workflows initialized', delay: 45, cls: 'success' },
    { text: '[BOOT]  All subsystems nominal', delay: 50, cls: 'success' },
    { text: '[BOOT]  Galahad Industries — READY', delay: 0, cls: 'warn' },
  ];

  // Type text with variable speed
  function typeText(element, text, baseSpeed, callback) {
    let i = 0;
    function type() {
      if (i < text.length) {
        element.textContent += text[i];
        i++;
        // Variable speed
        let speed = baseSpeed + Math.random() * 40;
        // Pause slightly on periods and ellipses
        if (text[i-1] === '.') speed += 80;
        setTimeout(type, speed);
      } else if (callback) {
        callback();
      }
    }
    type();
  }

  // Add a boot log line
  function addBootLine(msg, callback) {
    const line = document.createElement('div');
    line.className = 'boot-line';

    // Parse the message for bracket prefix
    const match = msg.text.match(/^(\[[A-Z]+\]\s*)(.*)/);
    if (match) {
      const prefix = document.createElement('span');
      prefix.className = 'prefix';
      prefix.textContent = match[1];
      line.appendChild(prefix);

      const content = document.createElement('span');
      if (msg.cls) content.className = msg.cls;
      content.textContent = match[2];
      line.appendChild(content);
    } else {
      line.textContent = msg.text;
    }

    bootLog.appendChild(line);

    // Trigger visibility
    requestAnimationFrame(() => {
      line.classList.add('visible');
    });

    setTimeout(() => {
      if (callback) callback();
    }, msg.delay + 60 + Math.random() * 80);
  }

  // Run boot messages sequentially
  function runBootSequence(messages, index, callback) {
    if (index >= messages.length) {
      if (callback) setTimeout(callback, 600);
      return;
    }
    addBootLine(messages[index], () => {
      runBootSequence(messages, index + 1, callback);
    });
  }

  // Phase 1: Blinking cursor for 1.2s
  setTimeout(() => {
    // Phase 2: Type "INITIALIZING..."
    typeText(initText, 'INITIALIZING...', 70, () => {
      // Phase 3: Pause, then shift up and show boot log
      setTimeout(() => {
        initLine.classList.add('shifted');
        cursorInit.style.display = 'none';

        setTimeout(() => {
          // Phase 4: Boot messages
          runBootSequence(bootMessages, 0, () => {
            // Phase 5: Transition to main scene
            setTimeout(() => {
              bootScreen.classList.add('fade-out');
              mainScene.classList.add('visible');
              initGrid();

              setTimeout(() => {
                bootScreen.style.display = 'none';
              }, 1000);
            }, 800);
          });
        }, 400);
      }, 500);
    });
  }, 1200);

  // === GRID BACKGROUND ===
  function initGrid() {
    const canvas = document.getElementById('grid-canvas');
    const ctx = canvas.getContext('2d');
    let w, h, cols, rows, cellSize;
    const pulses = [];
    const maxPulses = 8;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      cellSize = Math.max(40, Math.min(60, w / 25));
      cols = Math.ceil(w / cellSize) + 1;
      rows = Math.ceil(h / cellSize) + 1;
    }

    resize();
    window.addEventListener('resize', resize);

    // Pulse class
    class Pulse {
      constructor() {
        this.reset();
      }
      reset() {
        // Start from a random grid intersection
        const col = Math.floor(Math.random() * cols);
        const row = Math.floor(Math.random() * rows);
        this.x = col * cellSize;
        this.y = row * cellSize;
        this.horizontal = Math.random() > 0.5;
        this.speed = 1 + Math.random() * 2;
        this.direction = Math.random() > 0.5 ? 1 : -1;
        this.length = 40 + Math.random() * 80;
        this.alpha = 0.15 + Math.random() * 0.2;
        this.life = 0;
        this.maxLife = 200 + Math.random() * 300;
      }
      update() {
        if (this.horizontal) {
          this.x += this.speed * this.direction;
        } else {
          this.y += this.speed * this.direction;
        }
        this.life++;
        if (this.life > this.maxLife || this.x < -100 || this.x > w + 100 || this.y < -100 || this.y > h + 100) {
          this.reset();
        }
      }
      draw(ctx) {
        const fade = Math.min(1, this.life / 30) * Math.min(1, (this.maxLife - this.life) / 30);
        const a = this.alpha * fade;
        if (this.horizontal) {
          const grad = ctx.createLinearGradient(this.x - this.length, this.y, this.x, this.y);
          grad.addColorStop(0, `rgba(74, 158, 255, 0)`);
          grad.addColorStop(0.5, `rgba(74, 158, 255, ${a})`);
          grad.addColorStop(1, `rgba(74, 158, 255, 0)`);
          ctx.strokeStyle = grad;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(this.x - this.length, this.y);
          ctx.lineTo(this.x, this.y);
          ctx.stroke();
        } else {
          const grad = ctx.createLinearGradient(this.x, this.y - this.length, this.x, this.y);
          grad.addColorStop(0, `rgba(74, 158, 255, 0)`);
          grad.addColorStop(0.5, `rgba(74, 158, 255, ${a})`);
          grad.addColorStop(1, `rgba(74, 158, 255, 0)`);
          ctx.strokeStyle = grad;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(this.x, this.y - this.length);
          ctx.lineTo(this.x, this.y);
          ctx.stroke();
        }
      }
    }

    // Initialize pulses
    for (let i = 0; i < maxPulses; i++) {
      const p = new Pulse();
      p.life = Math.floor(Math.random() * p.maxLife);
      pulses.push(p);
    }

    function drawGrid() {
      ctx.clearRect(0, 0, w, h);

      // Grid lines
      ctx.strokeStyle = 'rgba(74, 158, 255, 0.04)';
      ctx.lineWidth = 0.5;

      for (let x = 0; x <= cols; x++) {
        ctx.beginPath();
        ctx.moveTo(x * cellSize, 0);
        ctx.lineTo(x * cellSize, h);
        ctx.stroke();
      }
      for (let y = 0; y <= rows; y++) {
        ctx.beginPath();
        ctx.moveTo(0, y * cellSize);
        ctx.lineTo(w, y * cellSize);
        ctx.stroke();
      }

      // Grid intersections — subtle dots
      ctx.fillStyle = 'rgba(74, 158, 255, 0.06)';
      for (let x = 0; x <= cols; x++) {
        for (let y = 0; y <= rows; y++) {
          ctx.beginPath();
          ctx.arc(x * cellSize, y * cellSize, 1, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Draw pulses
      for (const p of pulses) {
        p.update();
        p.draw(ctx);
      }

      requestAnimationFrame(drawGrid);
    }

    drawGrid();
  }
})();
</script>
</body>
</html>
