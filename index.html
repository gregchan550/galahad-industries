<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galahad Industries — Where Legacy Meets Intelligence</title>
<meta name="description" content="Galahad Industries — Enterprise AI software that replaces legacy systems at a fraction of the cost.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@200;300;400&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #fff;
    overflow: hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    cursor: crosshair;
  }

  canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
  }

  .overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    text-align: center;
  }

  .title-group {
    opacity: 0;
    transform: translateY(16px) scale(0.98);
    animation: fadeUp 2.5s cubic-bezier(0.16, 1, 0.3, 1) 3.2s forwards;
  }

  .title {
    font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    font-weight: 400;
    font-size: clamp(2.2rem, 5.5vw, 4.5rem);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    line-height: 1.1;
  }

  .title .galahad {
    display: block;
    color: #c9a84c;
    text-shadow: 0 0 60px rgba(201, 168, 76, 0.25), 0 0 120px rgba(201, 168, 76, 0.08);
  }

  .title .industries {
    display: block;
    font-family: 'Inter', sans-serif;
    font-weight: 200;
    font-size: 0.32em;
    letter-spacing: 0.55em;
    color: rgba(255, 255, 255, 0.5);
    margin-top: 0.4em;
  }

  .tagline {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(0.85rem, 1.8vw, 1.3rem);
    color: rgba(255, 255, 255, 0.35);
    margin-top: 1.8rem;
    letter-spacing: 0.1em;
    opacity: 0;
    animation: fadeIn 2.5s ease 4s forwards;
  }

  .coming-soon {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: clamp(0.55rem, 0.85vw, 0.7rem);
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: rgba(74, 158, 255, 0.4);
    margin-top: 3rem;
    opacity: 0;
    animation: fadeIn 2s ease 4.8s forwards;
  }

  .cta {
    margin-top: 2rem;
    opacity: 0;
    animation: fadeIn 2s ease 5.2s forwards;
    pointer-events: auto;
  }

  .cta a {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: clamp(0.6rem, 0.8vw, 0.72rem);
    letter-spacing: 0.18em;
    color: rgba(201, 168, 76, 0.55);
    text-decoration: none;
    border: 1px solid rgba(201, 168, 76, 0.18);
    padding: 0.75em 2.2em;
    transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    display: inline-block;
    text-transform: uppercase;
  }

  .cta a:hover {
    color: rgba(201, 168, 76, 0.9);
    border-color: rgba(201, 168, 76, 0.5);
    box-shadow: 0 0 40px rgba(201, 168, 76, 0.08), inset 0 0 20px rgba(201, 168, 76, 0.03);
    transform: translateY(-1px);
  }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  @media (max-width: 600px) {
    .coming-soon { margin-top: 2rem; }
    .cta { margin-top: 1.5rem; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay">
  <div class="title-group">
    <h1 class="title">
      <span class="galahad">Galahad</span>
      <span class="industries">Industries</span>
    </h1>
    <p class="tagline">Where legacy meets intelligence.</p>
    <p class="coming-soon">Coming Soon</p>
    <div class="cta">
      <a href="mailto:hello@galahadindustries.com">Get in Touch</a>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  // --- State ---
  let W, H, cx, cy, dpr;
  let mouseX = -9999, mouseY = -9999;
  let frame = 0;

  // --- Config ---
  const NODE_COUNT = 14;
  const GALAHAD_IDX = 0;
  const STAR_COUNT = 280;
  const TILT = 0.58; // radians, ~33 degrees
  const PERSPECTIVE = 900;
  const ROTATION_SPEED = 0.0006;

  // Colors
  const BLUE = [74, 158, 255];
  const GOLD = [201, 168, 76];

  // --- Stars ---
  const stars = Array.from({ length: STAR_COUNT }, () => ({
    x: Math.random(),
    y: Math.random(),
    r: Math.random() * 1.2 + 0.2,
    br: Math.random() * 0.35 + 0.08,
    sp: Math.random() * 0.015 + 0.003,
    ph: Math.random() * Math.PI * 2
  }));

  // --- Nodes ---
  const nodes = Array.from({ length: NODE_COUNT }, (_, i) => {
    const a = (i / NODE_COUNT) * Math.PI * 2 - Math.PI / 2;
    return {
      baseAngle: a,
      pulsePh: Math.random() * Math.PI * 2,
      pulseSp: 0.007 + Math.random() * 0.005,
      isGalahad: i === GALAHAD_IDX,
      hover: 0 // smooth 0-1
    };
  });

  // --- Edges ---
  const edgeSet = new Set();
  const edges = [];

  function addEdge(a, b) {
    if (a === b) return;
    const key = Math.min(a, b) * 100 + Math.max(a, b);
    if (edgeSet.has(key)) return;
    edgeSet.add(key);
    edges.push({ a, b, particles: [] });
  }

  // Ring
  for (let i = 0; i < NODE_COUNT; i++) addEdge(i, (i + 1) % NODE_COUNT);
  // Skip-1
  for (let i = 0; i < NODE_COUNT; i++) addEdge(i, (i + 2) % NODE_COUNT);
  // Diameter crosses (selective)
  for (let i = 0; i < NODE_COUNT; i += 3) addEdge(i, (i + Math.floor(NODE_COUNT / 2)) % NODE_COUNT);
  for (let i = 0; i < NODE_COUNT; i += 4) addEdge(i, (i + Math.floor(NODE_COUNT / 3)) % NODE_COUNT);
  // Galahad hub spokes
  for (let i = 2; i < NODE_COUNT; i += 3) addEdge(GALAHAD_IDX, i);

  // --- Particles ---
  function spawnParticle(edge) {
    const fwd = Math.random() > 0.5;
    edge.particles.push({
      t: fwd ? 0 : 1,
      v: (0.0015 + Math.random() * 0.003) * (fwd ? 1 : -1),
      sz: Math.random() * 1.4 + 0.5
    });
  }

  // Seed
  edges.forEach(e => { for (let i = 0; i < 2; i++) spawnParticle(e); });

  // --- Resize ---
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2;
    cy = H / 2;
  }

  // --- Projection ---
  function tableRadius() {
    return Math.min(W, H) * 0.28;
  }

  function project(angle, rot) {
    const r = tableRadius();
    const a = angle + rot;
    const cosT = Math.cos(TILT);
    const sinT = Math.sin(TILT);

    const x3 = Math.cos(a) * r;
    const y3 = Math.sin(a) * r * cosT;
    const z3 = Math.sin(a) * r * sinT;

    const s = PERSPECTIVE / (PERSPECTIVE + z3);
    return { x: cx + x3 * s, y: cy + y3 * s, s, z: z3 };
  }

  // --- Helpers ---
  function lerp(a, b, t) { return a + (b - a) * t; }
  function rgba(c, a) { return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
  function lerpColor(c1, c2, t) {
    return [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
  }

  // --- Draw ---
  function render() {
    frame++;
    const rot = frame * ROTATION_SPEED;

    // Intro easing (first 3s at 60fps = 180 frames)
    const intro = Math.min(frame / 180, 1);
    const nodeReveal = Math.max(0, (intro - 0.05) / 0.55);
    const edgeReveal = Math.max(0, (intro - 0.35) / 0.65);
    const particleReveal = edgeReveal > 0.7 ? 1 : 0;

    ctx.clearRect(0, 0, W, H);

    // Background
    const bg = ctx.createRadialGradient(cx, cy * 0.9, 0, cx, cy, Math.max(W, H) * 0.75);
    bg.addColorStop(0, '#080c18');
    bg.addColorStop(0.4, '#050810');
    bg.addColorStop(1, '#000000');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // Stars
    for (const s of stars) {
      const flk = Math.sin(frame * s.sp + s.ph) * 0.5 + 0.5;
      const a = s.br * (0.4 + flk * 0.6) * Math.min(intro * 2.5, 1);
      ctx.fillStyle = rgba([180, 200, 240], a);
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // Compute all node screen positions
    const pos = nodes.map(n => project(n.baseAngle, rot));

    // Update hover
    for (let i = 0; i < nodes.length; i++) {
      const dx = mouseX - pos[i].x;
      const dy = mouseY - pos[i].y;
      const near = Math.sqrt(dx * dx + dy * dy) < 45;
      nodes[i].hover += ((near ? 1 : 0) - nodes[i].hover) * 0.07;
    }

    // Sort edges by depth (far first)
    const edgeOrder = edges.map((e, i) => i)
      .sort((a, b) => {
        const za = pos[edges[a].a].z + pos[edges[a].b].z;
        const zb = pos[edges[b].a].z + pos[edges[b].b].z;
        return zb - za;
      });

    // Draw edges
    for (const ei of edgeOrder) {
      const edge = edges[ei];
      const pa = pos[edge.a];
      const pb = pos[edge.b];
      const na = nodes[edge.a];
      const nb = nodes[edge.b];
      const avgS = (pa.s + pb.s) / 2;
      const depth01 = (avgS - 0.88) / 0.24;
      const depthA = lerp(0.08, 0.35, Math.max(0, Math.min(1, depth01)));
      const hv = Math.max(na.hover, nb.hover);
      const isGold = na.isGalahad || nb.isGalahad;
      const baseColor = isGold ? lerpColor(BLUE, GOLD, 0.4) : BLUE;

      // Main line
      const lineA = (depthA + hv * 0.25) * edgeReveal;
      if (lineA > 0.005) {
        ctx.strokeStyle = rgba(baseColor, lineA);
        ctx.lineWidth = (0.6 + hv * 1.2) * avgS;
        ctx.beginPath();
        ctx.moveTo(pa.x, pa.y);
        ctx.lineTo(pb.x, pb.y);
        ctx.stroke();
      }

      // Glow on hover
      if (hv > 0.02) {
        const glowC = isGold ? GOLD : BLUE;
        ctx.strokeStyle = rgba(glowC, hv * 0.1 * edgeReveal);
        ctx.lineWidth = (4 + hv * 5) * avgS;
        ctx.beginPath();
        ctx.moveTo(pa.x, pa.y);
        ctx.lineTo(pb.x, pb.y);
        ctx.stroke();
      }

      // Particles
      if (particleReveal) {
        // Spawn
        if (Math.random() < 0.015 + (isGold ? 0.015 : 0)) spawnParticle(edge);

        for (let pi = edge.particles.length - 1; pi >= 0; pi--) {
          const p = edge.particles[pi];
          p.t += p.v;
          if (p.t < 0 || p.t > 1) {
            edge.particles.splice(pi, 1);
            continue;
          }

          const px = lerp(pa.x, pb.x, p.t);
          const py = lerp(pa.y, pb.y, p.t);
          const ps = lerp(pa.s, pb.s, p.t);
          const fade = Math.min(p.t * 6, (1 - p.t) * 6, 1);
          const col = isGold ? GOLD : BLUE;
          const alpha = fade * 0.7 * ps;

          // Glow
          const gr = 5 * ps;
          const g = ctx.createRadialGradient(px, py, 0, px, py, gr);
          g.addColorStop(0, rgba(col, alpha));
          g.addColorStop(1, rgba(col, 0));
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(px, py, gr, 0, Math.PI * 2);
          ctx.fill();

          // Core
          ctx.fillStyle = rgba([255, 255, 255], alpha * 0.7);
          ctx.beginPath();
          ctx.arc(px, py, p.sz * ps * 0.8, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    // Sort nodes by depth (far first) then draw
    const nodeOrder = nodes.map((_, i) => i)
      .sort((a, b) => pos[b].z - pos[a].z);

    for (const ni of nodeOrder) {
      const node = nodes[ni];
      const p = pos[ni];

      const appear = Math.min(Math.max((nodeReveal - ni / NODE_COUNT) * NODE_COUNT / 3, 0), 1);
      if (appear < 0.001) continue;

      const pulse = Math.sin(frame * node.pulseSp + node.pulsePh) * 0.5 + 0.5;
      const base = node.isGalahad ? 5.5 : 3.5;
      const sz = (base + pulse * 1.5 + node.hover * 2.5) * p.s * appear;
      const col = node.isGalahad ? GOLD : BLUE;
      const glowBase = node.isGalahad ? 0.35 : 0.18;

      // Outer glow
      const glowR = (22 + pulse * 12 + node.hover * 18) * p.s * appear;
      const og = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowR);
      og.addColorStop(0, rgba(col, (glowBase + node.hover * 0.2) * appear));
      og.addColorStop(0.35, rgba(col, 0.06 * appear));
      og.addColorStop(1, rgba(col, 0));
      ctx.fillStyle = og;
      ctx.beginPath();
      ctx.arc(p.x, p.y, glowR, 0, Math.PI * 2);
      ctx.fill();

      // Core gradient
      const cg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, sz);
      cg.addColorStop(0, rgba([255, 255, 255], (0.85 + node.hover * 0.15) * appear));
      cg.addColorStop(0.45, rgba(col, (0.75 + pulse * 0.25) * appear));
      cg.addColorStop(1, rgba(col, 0));
      ctx.fillStyle = cg;
      ctx.beginPath();
      ctx.arc(p.x, p.y, sz, 0, Math.PI * 2);
      ctx.fill();

      // Hot center
      ctx.fillStyle = rgba([255, 255, 255], (0.6 + pulse * 0.4) * appear);
      ctx.beginPath();
      ctx.arc(p.x, p.y, sz * 0.25, 0, Math.PI * 2);
      ctx.fill();
    }

    // Subtle center ambient glow
    const centerR = tableRadius() * 0.45;
    const cg2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, centerR);
    cg2.addColorStop(0, rgba(GOLD, 0.025 * intro));
    cg2.addColorStop(0.6, rgba(BLUE, 0.008 * intro));
    cg2.addColorStop(1, rgba([0, 0, 0], 0));
    ctx.fillStyle = cg2;
    ctx.beginPath();
    ctx.arc(cx, cy, centerR, 0, Math.PI * 2);
    ctx.fill();

    requestAnimationFrame(render);
  }

  // --- Events ---
  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
  window.addEventListener('touchmove', e => { mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; }, { passive: true });
  window.addEventListener('touchend', () => { mouseX = mouseY = -9999; });

  resize();
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
